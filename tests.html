<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<!-- Every page on the shared origin ships a CSP (the family security rule) —
     this one is published on GitHub Pages beside the app, so it is as much a
     page on the origin as index.html is. It needs: its own inline script and
     styles, the same-origin stylesheet, connect-src 'self' to read index.html
     as text (the halt can't be run live — see the newer-build group), plus
     api.github.com for the CI-scorecard line, and frame-src 'self' for the
     harness iframe (whose content is then governed by index.html's own CSP,
     not this one). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self' https://api.github.com; frame-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint Velocity — Tests</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Dev-only page: pins the pure functions in index.html. It loads the real app
     in a hidden same-origin iframe and calls its functions directly, so what's
     tested is exactly what ships — no copies, no build step. Serve over
     http://localhost (python3 -m http.server 8012); file:// iframes are blocked
     in some browsers. Nothing here writes localStorage or calls save().

     But the iframe boots the real app, which is not nothing: it reads and can
     write this origin's sv-* keys, and on the published site those are somebody's
     real teams. So the gate at the foot of this script refuses to create the
     iframe at all off localhost — GitHub Pages publishes this file next to the
     app, so "somewhere else" is a page anyone can open.

     The iframe also carries data-sv-tests. That was how index.html's sync module
     knew to stay off in the harness — without it, an origin that had ever signed
     in would have started a live Firestore session inside an invisible frame.
     Sync was removed on 2026-08-20 and nothing reads the attribute now; it is
     kept because it is the harness's only way to say "this is a test frame", and
     the next thing that must not run in one will want it. */
  body { background: var(--bg); color: var(--text-primary); margin: 0;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--text-muted); font-size: 12.5px; margin: 0 0 18px; }
  #summary { font-weight: 600; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px;
             border: 1px solid var(--border); background: var(--surface); }
  #summary.ok  { color: var(--ok);  border-color: var(--ok); }
  #summary.bad { color: var(--err); border-color: var(--err); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  td.st { width: 28px; font-weight: 700; }
  tr.pass td.st { color: var(--ok); }
  tr.fail td.st { color: var(--err); }
  tr.fail td.msg { color: var(--err); }
  .msg { color: var(--text-muted); font-size: 12px; white-space: pre-wrap; }
  .group td { padding-top: 16px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
              text-transform: uppercase; color: var(--text-muted); border-bottom-color: var(--border-strong); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sprint Velocity — Pure-Function Tests</h1>
  <p class="sub">Runs against the real <code>index.html</code> in a hidden iframe. Read-only:
    nothing is saved — and it only runs on <code>localhost</code>, where that iframe can't be
    the copy of the app holding your own data.</p>
  <div id="summary">Loading app…</div>
  <table><tbody id="out"></tbody></table>
</div>
<!-- The iframe is built in script, not here: it boots the real app, so it must
     not exist until the localhost gate at the foot of this file has passed. -->

<script>
'use strict';
const TESTS = [];
let currentGroup = '';
function group(name) { TESTS.push({ group: name }); }
function t(name, fn) { TESTS.push({ name, fn }); }

function fmt(v) { return typeof v === 'string' ? JSON.stringify(v) : JSON.stringify(v); }
function eq(actual, expected, note) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error((note ? note + ': ' : '') + 'expected ' + e + ', got ' + a);
}
function approx(actual, expected, note, eps) {
  if (typeof actual !== 'number' || Math.abs(actual - expected) > (eps || 1e-9))
    throw new Error((note ? note + ': ' : '') + 'expected ≈' + expected + ', got ' + fmt(actual));
}
function ok(cond, note) { if (!cond) throw new Error(note || 'expected truthy'); }
/* ── The completeness floor ─────────────────────────────────────────────────
   "Everything that ran passed" is only half an answer. Nothing above counts the
   tests, so a group deleted by accident — or a `PAGES.forEach` that ends up
   iterating nothing — takes its tests out of the suite silently, and the page
   and CI both go on reporting green over whatever is left. CI checks the words
   `All N tests pass` and has never cared what N is.

   This is what makes the count itself an assertion. It is the number the suite
   registers today, so ADDING a test never fails the build; removing one does,
   which is the moment to ask whether it should have gone. Lower it deliberately
   when a test is deliberately retired. */
const EXPECTED = 384;
/* HTML comments explain things by naming them — including the very elements
   these assertions look for, and one of those notes lives in a <style> block a
   strip does not reach. So the comments come out before the page is matched
   against, or the prose passes the test it is describing.

   Looped until the string stops changing, rather than a single .replace(). One
   pass over a multi-character delimiter can leave a NEW opener behind that the
   pass already went past — `<` `!--` `<` `!--` `--` `>` collapses to a live
   `<` `!--` on the way out — so a single pass is only as good as the input is
   well-formed. CodeQL's js/incomplete-multi-character-sanitization flagged
   exactly this. The stakes are low (this reads local repo files to assert on
   them, it does not sanitize anything a browser will render) but a test that
   can be fooled about what is commented out is a test that can miss a live
   off-origin script, so it is worth doing properly. Same helper, same wording,
   in every sibling repo’s suite. */
const stripHtmlComments = (s) => {
  let out = String(s), prev;
  do { prev = out; out = out.replace(/<!--[\s\S]*?-->/g, ''); } while (out !== prev);
  return out;
};


/* nextSprintTarget() and rollingSprints() read the app's live `state` rather than
   taking it as an argument, so these tests swap the collections in, run, and put
   the originals back — always in a finally, or one failure would leave the fixture
   in place and every later test would be measuring it. Nothing here calls save():
   the suite is read-only, which is the promise printed at the top of the page. */
function withState(data, fn) {
  const st = w.svGet();
  const keys = ['teams', 'arts', 'pis', 'sprints', 'plans', 'objectives'];
  const before = {};
  keys.forEach(k => { before[k] = st[k]; });
  const inProg = st.settings.includeInProgress;
  keys.forEach(k => { st[k] = data[k] || []; });
  st.settings.includeInProgress = !!data.includeInProgress;
  try { return fn(); }
  finally {
    keys.forEach(k => { st[k] = before[k]; });
    st.settings.includeInProgress = inProg;
  }
}

/* One team, one PI, four finished sprints. No dates on purpose — sprintStatus()
   treats a dateless sprint as complete, which is what keeps pre-lifecycle history
   in the averages, and it keeps these fixtures to the figures under test. Four
   rather than five so the slot being planned is S5, not the IP sprint, whose own
   caveat would otherwise ride along on every assertion here. */
function capacityFixture(extra) {
  const done = [10, 20, 30, 40];
  return Object.assign({
    teams: [{ id: 't1', name: 'Team One' }],
    arts: [],
    pis: [{ id: 'p1', name: 'PI 1' }],
    sprints: done.map((v, i) => ({
      id: 's' + (i + 1), teamId: 't1', piId: 'p1', sprintNumber: i + 1,
      committed: v, committedCompleted: v, totalCompleted: v,
      added: 0, removed: 0, carriedIn: 0, carriedOut: 0, addedThenRemoved: 0
    })),
    plans: []
  }, extra || {});
}

/* Sprints described by exactly what the headroom signal reads: what was committed,
   how much of the commitment landed, and how much extra work came in on top of it
   and finished. Dateless like capacityFixture, and for the same reason. */
function headroomFixture(rows) {
  return {
    teams: [{ id: 't1', name: 'Team One' }],
    arts: [],
    pis: [{ id: 'p1', name: 'PI 1' }],
    sprints: rows.map((r, i) => ({
      id: 's' + (i + 1), teamId: 't1', piId: 'p1', sprintNumber: i + 1,
      committed: r.committed, committedCompleted: r.done,
      totalCompleted: r.done + (r.extra || 0), added: r.extra || 0,
      removed: 0, carriedIn: 0, carriedOut: 0, addedThenRemoved: 0
    })),
    plans: []
  };
}

/* ── Fixtures ─────────────────────────────────────────────────────────────── */

/* An ordinary tab-separated Sprint Report paste: three sections, one starred
   (added mid-sprint) completed issue, and one issue that was added then removed
   (starred AND in the removed section — must net out of both). Header totals
   are Jira's own checksums and match the rows. */
const TABBED = [
  'Completed Issues',
  'Key\tSummary\tIssue Type\tPriority\tStatus\tStory Points (13)',
  'ABC-1\tBuild the thing\tStory\tHigh\tDone\t5',
  'ABC-2\tFix the thing\tBug\tMedium\tDone\t3',
  'ABC-3 *\tBroke in and finished\tStory\tHigh\tDone\t5',
  'Issues Not Completed',
  'Key\tSummary\tIssue Type\tPriority\tStatus\tStory Points (8)',
  'ABC-4\tHalf done\tStory\tLow\tIn Progress\t8',
  'Issues Removed From Sprint',
  'Key\tSummary\tIssue Type\tPriority\tStatus\tStory Points (7)',
  'ABC-5\tDescoped\tStory\tLow\tOpen\t2',
  'ABC-6 *\tIn then out\tStory\tLow\tOpen\t5',
].join('\n');

/* Mid-sprint re-estimates: rows carry "start → current" and the header carries
   the same range. Committed must use the start sizes; everything else current. */
const RESIZED = [
  'Completed Issues',
  'Key\tSummary\tStatus\tStory Points (21 → 15)',
  'XYZ-1\tBig story, shrank\tDone\t13 → 8',
  'XYZ-2\tSteady-ish\tDone\t8 → 7',
  'Issues Not Completed',
  'Key\tSummary\tStatus\tStory Points (5)',
  'XYZ-3\tRolls over\tIn Progress\t5',
].join('\n');

/* Some browsers flatten a copied table to one cell per line. Every issue key on
   its own line — the flattened branch must win on the count of such lines. */
const FLATTENED = [
  'Completed Issues',
  'Story Points (8)',
  'ABC-1',
  'First thing',
  'Story',
  '5',
  'ABC-2',
  'Second thing',
  'Story',
  '3',
].join('\n');

/* The documented regression: one stray bare key (a linked epic copying onto its
   own line) must NOT flip a tabbed report into the flattened branch. */
const TABBED_WITH_STRAY = [
  'Completed Issues',
  'Key\tSummary\tStatus\tStory Points (8)',
  'ABC-1\tFirst thing\tDone\t5',
  'EPIC-99',
  'ABC-2\tSecond thing\tDone\t3',
].join('\n');

/* A trailing "-" cell after the estimate column must not zero the row; a row
   whose only figure is "-" is genuinely unestimated and reads 0. */
const TRAILING_DASH = [
  'Completed Issues',
  'Key\tSummary\tStatus\tStory Points (3)',
  'ABC-7\tEstimated, decorative dash after\tDone\t3\t-',
  'ABC-8\tGenuinely unestimated\tDone\t-',
].join('\n');

/* ── Tests ────────────────────────────────────────────────────────────────── */
let w; // the app iframe's window

/* One cache-buster for this run, on every hidden frame AND every fetch of a
   file this repo ships. The two are different caches and they can disagree:
   on 2026-08-22 the lottery repo's suite reported all-green against a page
   three features out of date, because its source-level tests were reading the
   file off the server while its frames ran a copy the browser had cached.
   Nothing errored and nothing looked wrong — the new code was simply never
   run. A suite that can pass against a build which exists nowhere is worse
   than no suite, because it turns "untested" into "verified".

   `no-store` on the fetches as well as the query, since a query alone is only
   a hint. The GitHub API call at the foot of this file is deliberately left
   alone: it is somebody else's endpoint, not a file we ship. */
const BUST = '?t=' + Date.now();
const bustFetch = (f, init) => fetch(f + BUST, Object.assign({ cache: 'no-store' }, init || {}));

group('sanitizeIds — the untrusted-id boundary');
t('hostile ids are replaced and every reference rewritten through the same map', () => {
  const evil = 'x"><img src=q onerror=alert(1)>';
  const data = {
    teams: [{ id: evil, name: 'T' }],
    pis: [{ id: 'ok-pi', name: 'PI' }],
    sprints: [{ id: 's1', teamId: evil, piId: 'ok-pi', sprintNumber: 1 }],
    settings: { activeTeamId: evil, activePiId: 'ok-pi' },
  };
  const out = w.sanitizeIds(data);
  const fresh = out.teams[0].id;
  ok(/^[A-Za-z0-9_-]{1,64}$/.test(fresh), 'replacement id is a plain id');
  ok(fresh !== evil, 'hostile id was replaced');
  eq(out.sprints[0].teamId, fresh, 'sprint.teamId follows the team');
  eq(out.settings.activeTeamId, fresh, 'settings.activeTeamId follows the team');
  eq(out.pis[0].id, 'ok-pi', 'valid ids pass through untouched');
  eq(out.sprints.length, 1, 'a remapped sprint is not mistaken for an orphan');
  eq(w.sanitizeIds.dropped, 0, 'nothing dropped');
});
t('a sprint whose TEAM is missing is dropped; a missing PI only UN-GROUPS it', () => {
  /* The drop used to take both, and while a PI was compulsory that was right: an
     orphan moved a rolling average with nothing on screen behind it, because no
     PI-based view could show it. A sprint with no PI is now an ordinary visible
     sprint, so a broken PI reference costs the grouping and nothing else — the
     same call this boundary already makes for a team whose ART has gone. A team,
     though, is still fatal: there is no view a team-less sprint appears on. */
  const data = {
    teams: [{ id: 'team-1', name: 'A' }],
    pis: [{ id: 'pi-1', name: 'PI 1' }],
    sprints: [
      { id: 's1', teamId: 'team-1', piId: 'pi-1', sprintNumber: 1 },
      { id: 's2', teamId: 'team-1', piId: 'pGONE', sprintNumber: 2 },
      { id: 's3', teamId: 'tGONE', piId: 'pi-1', sprintNumber: 3 },
    ],
    settings: {},
  };
  const out = w.sanitizeIds(data);
  eq(out.sprints.map(x => x.id), ['s1', 's2'], 'the PI orphan survives; the team orphan does not');
  eq(out.sprints[1].piId, null, 'and it survives UN-GROUPED, not still pointing at a ghost');
  eq(w.sanitizeIds.dropped, 1, 'only the team orphan counts as a loss');
  eq(w.sanitizeIds.unassigned, 1, 'the un-grouping is counted separately, so it can be reported');
});
t('a sprint that never had a PI passes through untouched', () => {
  const out = w.sanitizeIds(w.coerceShape({
    teams: [{ id: 't1', name: 'A' }], arts: [], pis: [],
    sprints: [{ id: 's1', teamId: 't1', piId: null, sprintNumber: 12, committed: 20 }],
    settings: {},
  }));
  eq(out.sprints.length, 1, 'no PI is not a broken PI');
  eq(out.sprints[0].piId, null);
  eq(out.sprints[0].sprintNumber, 12, 'and its number is not clamped to a PI’s six slots');
  eq(w.sanitizeIds.dropped, 0);
  eq(w.sanitizeIds.unassigned, 0, 'nothing was un-grouped — it was never grouped');
});
t('the empty string collapses to null, so a picker’s none-option is storable', () => {
  const out = w.sanitizeIds(w.coerceShape({
    teams: [{ id: 't1', name: 'A' }], arts: [], pis: [],
    sprints: [{ id: 's1', teamId: 't1', piId: '', sprintNumber: 1 }],
    settings: {},
  }));
  eq(out.sprints[0].piId, null, 'an empty-string id names nothing and must not be stored as one');
});
t('the drop count resets, so a caller never reads a stale one', () => {
  w.sanitizeIds({ teams: [], pis: [], sprints: [{ id: 's1', teamId: 'gone', piId: 'gone' }] });
  eq(w.sanitizeIds.dropped, 1);
  w.sanitizeIds({ teams: [{ id: 't1' }], pis: [{ id: 'p1' }], sprints: [] });
  eq(w.sanitizeIds.dropped, 0, 'a clean payload reports zero');
  eq(w.sanitizeIds.unassigned, 0, 'and so does the un-grouping count');
  w.sanitizeIds(null);
  eq(w.sanitizeIds.dropped, 0, 'so does junk that never reaches the check');
});
t('valid data passes through byte-identical', () => {
  const data = { teams: [{ id: 'team-1', name: 'A' }], pis: [], sprints: [], settings: {} };
  const out = w.sanitizeIds(JSON.parse(JSON.stringify(data)));
  eq(out.teams[0].id, 'team-1');
});
t('non-object input is returned as-is, not exploded', () => {
  eq(w.sanitizeIds(null), null);
  eq(w.sanitizeIds('junk'), 'junk');
});
/* The regression that took cloud sync down when ARTs shipped. `x.id = clean(x.id)`
   on an absent key creates it holding `undefined`; JSON.stringify drops that, so
   localStorage and every export looked perfect, while setDoc() walked the live
   object and Firestore refused the whole document with invalid-argument. Checked by
   key, not by value — `out.settings.artFilter === undefined` passes either way. */
const undefKeys = (o) => Object.keys(o).filter(k => o[k] === undefined);
t('a setting that is absent stays absent, never created holding undefined', () => {
  const out = w.sanitizeIds({ teams: [], arts: [], pis: [], sprints: [],
                              settings: { view: 'sprint' } });
  eq(undefKeys(out.settings), [], 'invisible in JSON, fatal to the cloud push');
  ok(!('artFilter' in out.settings), 'a copy saved before ARTs existed gains no artFilter key');
});
t('the same holds for every id the boundary touches', () => {
  const out = w.sanitizeIds({ teams: [{ name: 'no id' }], arts: [{ name: 'no id' }],
                              pis: [{ name: 'no id' }], sprints: [], settings: {} });
  eq(undefKeys(out.teams[0]), []);
  eq(undefKeys(out.arts[0]), []);
  eq(undefKeys(out.pis[0]), []);
  eq(undefKeys(out.settings), []);
});
t('a whole saved copy survives the round trip with no undefined anywhere in it', () => {
  /* What the cloud push actually hands Firestore — every nested object, not just
     the top level, since one undefined at any depth rejects the document. */
  const deepUndef = (v, path) => (v && typeof v === 'object')
    ? Object.keys(v).flatMap(k => v[k] === undefined ? [path + '.' + k] : deepUndef(v[k], path + '.' + k))
    : [];
  const out = w.sanitizeIds(w.coerceShape({
    teams: [{ id: 't1', name: 'A' }],
    pis: [{ id: 'p1', name: 'PI 1' }],
    sprints: [{ id: 's1', teamId: 't1', piId: 'p1', sprintNumber: 1 }],
    settings: { activeTeamId: 't1', view: 'sprint' },
  }));
  eq(deepUndef(out, 'state'), []);
});

/* Only numbers and dates are ever saved. The old free-text notes feature was
   removed on purpose — the figures come from a work Jira and the saved/synced
   copy must stay clean — so notes arriving in an old localStorage copy, cloud
   document, backup or share link are deleted at this boundary and counted. */
t('legacy free-text notes are scrubbed at the boundary, and counted', () => {
  const out = w.sanitizeIds({
    teams: [{ id: 't1', name: 'A' }], arts: [], pis: [{ id: 'p1', name: 'PI 1' }],
    sprints: [
      { id: 's1', teamId: 't1', piId: 'p1', sprintNumber: 1,
        notes: { added: 'sensitive detail', removed: '', carriedOut: '', general: '' } },
      { id: 's2', teamId: 't1', piId: 'p1', sprintNumber: 2 },
    ],
    settings: {},
  });
  ok(!('notes' in out.sprints[0]), 'the notes key is deleted, not emptied');
  eq(undefKeys(out.sprints[0]), [], 'and never left holding undefined — that stops the cloud push');
  eq(w.sanitizeIds.strippedNotes, 1, 'the count is handed to the caller so boot can persist the scrub');
  w.sanitizeIds({ teams: [], arts: [], pis: [], sprints: [], settings: {} });
  eq(w.sanitizeIds.strippedNotes, 0, 'and it resets, so a caller never reads a stale one');
});

/* The whitelist half of the same boundary: only numbers, dates and short labels
   are ever saved, so a stray key from a hand-edited backup, cloud document or
   share link is dropped, and a known key holding the wrong kind of value is
   pinned back to its type rather than stored as-is. */
t('stray keys are dropped and wrong-typed values pinned at the boundary', () => {
  const out = w.sanitizeIds(w.coerceShape({
    junkTop: 'DAE-1023 a work item summary',
    teams: [{ id: 't1', name: 'A', smuggled: 'ticket text', artId: null }],
    arts: [], pis: [{ id: 'p1', name: 'PI 1' }],
    sprints: [{ id: 's1', teamId: 't1', piId: 'p1', sprintNumber: 1,
      committed: '12', startDate: 'call John about the incident',
      status: 'weird', freeText: 'DAE-99 another summary' }],
    settings: { activeTeamId: 't1', rogue: 'text nobody asked for' },
  }));
  ok(!('junkTop' in out), 'a stray top-level key is dropped');
  ok(!('smuggled' in out.teams[0]), 'a stray team key is dropped');
  ok(!('freeText' in out.sprints[0]), 'a stray sprint key is dropped');
  ok(!('rogue' in out.settings), 'a stray settings key is dropped');
  eq(out.teams[0].artId, null, 'a legitimately-null artId survives');
  eq(out.sprints[0].committed, 12, 'a figure arriving as a string is stored as a number');
  eq(out.sprints[0].startDate, '', 'a date that is not a date is emptied, never stored as text');
  eq(out.sprints[0].status, 'auto', 'an unknown status falls back to auto');
  ok(w.sanitizeIds.pruned > 0, 'the scrub is counted so boot can persist it');
  eq(undefKeys(out.sprints[0]), [], 'and nothing is left holding undefined');
});
t('a clean copy prunes nothing, so boot never saves for no reason', () => {
  w.sanitizeIds(w.coerceShape({
    version: 1,
    teams: [{ id: 't1', name: 'A', artId: null }],
    arts: [], pis: [{ id: 'p1', name: 'PI 1' }],
    sprints: [{ id: 's1', teamId: 't1', piId: 'p1', sprintNumber: 1,
      startDate: '2026-06-01', endDate: '2026-06-12', status: 'auto',
      committed: 30, committedCompleted: 28, totalCompleted: 31, added: 3,
      removed: 0, carriedIn: 2, carriedOut: 2, addedThenRemoved: 0 }],
    settings: { activeTeamId: 't1', activePiId: 'p1', activeSprintNum: 1,
      artFilter: null, includeSprint6InRolling: false,
      includeInProgress: false, view: 'sprint' },
  }));
  eq(w.sanitizeIds.pruned, 0, 'every key the app itself writes passes untouched');
});
t('share-meta keys cross the boundary intact, for the shared-view banner', () => {
  const out = w.sanitizeIds(w.coerceShape({
    v: 1, sharedAt: 1755000000000, label: 'Team A', allTeams: false,
    range: { kind: 'pi', n: 1 },
    teams: [{ id: 't1', name: 'A' }], arts: [], pis: [], sprints: [], settings: {},
  }));
  eq(out.sharedAt, 1755000000000, 'sharedAt survives');
  eq(out.label, 'Team A', 'the label survives');
  eq(out.range.n, 1, 'the range survives — the banner is built from its two numbers');
});

t('a team pointing at a missing ART is un-grouped, never dropped', () => {
  const data = {
    teams: [{ id: 'team-1', name: 'A', artId: 'aGONE' }, { id: 'team-2', name: 'B', artId: 'art-1' }],
    arts: [{ id: 'art-1', name: 'Payments' }],
    pis: [{ id: 'pi-1' }], sprints: [],
    settings: { artFilter: 'aGONE' },
  };
  const out = w.sanitizeIds(data);
  eq(out.teams.length, 2, 'a broken label never costs a team its data');
  eq(out.teams[0].artId, null, 'the dangling ART is cleared, so the team reads as "No ART"');
  eq(out.teams[1].artId, 'art-1', 'a real ART is left alone');

group('rag + fmtPct — bands and the never-contradict-the-colour rule');
/* Every assertion about a BOUNDARY runs inside withTargets(null, …) as of
   2026-08-22, when the eight boundaries became settings. The suite boots the real
   app against the real localStorage on this machine, so without it these tests
   would judge by whatever targets the person running them happens to have set —
   and fail, correctly and uselessly, on their own configuration. Pinning the
   defaults is what makes them about the SHAPE of each scale again. */
t('completion bands: ≥85 green, 75–<85 yellow, <75 red; null is none', () => {

group('the share dialog’s Rolling 5 warning');
/* Cutting a link below the rolling window changes the recipient's figures, so the
   sender is warned which teams it hits. The count therefore has to apply EVERY
   rule rollingSprints() applies, or the warning is about figures that match
   perfectly well — or, worse, stays silent about ones that don't. */
function shareNoteFixture(sprints) {
  return {
    teams: [{ id: 't1', name: 'No-PI Team' }],
    arts: [], pis: [], objectives: [], plans: [],
    sprints,
    settings: { includeSprint6InRolling: false, includeInProgress: false },
  };
}
const noteSprint = (n, extra) => Object.assign({
  id: 's' + n, teamId: 't1', piId: null, sprintNumber: n,
  committed: 20, committedCompleted: 18, totalCompleted: 20,
  added: 0, removed: 0, carriedIn: 0, carriedOut: 0, addedThenRemoved: 0,
}, extra || {});

t('a PI-less sprint 6 counts, so five sprints raise no warning', () => {
  /* It read `sprintNumber !== IP_SPRINT` and dropped this sprint from the count,
     warning that a full window of five would arrive as four. */
  const fx = shareNoteFixture([2, 3, 4, 5, 6].map(n => noteSprint(n)));
  withState(fx, () => {
    eq(w.rollingSprints('t1', false).length, 5, 'the recipient’s window really holds five');
    eq(w.shareRollingNote(fx, { kind: 'n', n: 5 }), '',
      'so there is nothing for the sender to be warned about');
  });
});
t('an excluded sprint does shorten it, and now says so', () => {
  /* The same mistake with the sign flipped: `excluded` was not checked at all, so
     a team that really will average four at the far end went unmentioned. */
  const fx = shareNoteFixture(
    [2, 3, 4, 5, 6].map(n => noteSprint(n, n === 6 ? { excluded: true, excludeReason: 'incident' } : null)));
  withState(fx, () => {
    eq(w.rollingSprints('t1', false).length, 4);
    const note = w.shareRollingNote(fx, { kind: 'n', n: 5 });
    ok(note.includes('No-PI Team (4)'), 'the team and its real count are named: ' + note);
  });
});
t('a sprint 6 INSIDE a PI is still left out of the count', () => {
  const fx = shareNoteFixture([2, 3, 4, 5, 6].map(n => noteSprint(n)));
  fx.pis = [{ id: 'p1', name: 'PI 1' }];
  fx.sprints.forEach(sp => { sp.piId = 'p1'; });
  withState(fx, () => {
    eq(w.rollingSprints('t1', false).length, 4, 'the IP sprint stays out of the window');
    ok(w.shareRollingNote(fx, { kind: 'n', n: 5 }).includes('No-PI Team (4)'),
      'and the warning matches it');
  });
});
t('a PI-less team’s adjustment goes into the link and survives the far end', async () => {
  /* buildSharePayload gated the plan on `usedPis.has(pl.piId)`, which is true for a
     null piId only when one of the trimmed sprints happened to be unassigned too —
     so the adjustment fell out of the link for reasons that had nothing to do with
     it, and the recipient's card quietly disagreed with the sender's screen. */
  const fx = shareNoteFixture([12, 13, 14].map(n => noteSprint(n)));
  fx.pis = [{ id: 'p1', name: 'PI 1' }];
  fx.plans = [{ id: 'pl1', teamId: 't1', piId: null, sprintNumber: 15,
                availability: 60, reason: 'leave' }];
  let token;
  withState(fx, () => {
    const payload = w.buildSharePayload({ teamIds: ['t1'], includeAllTeams: false, scope: { kind: 'all' } });
    eq(payload.plans.length, 1, 'the adjustment is in the payload');
    token = payload;
  });
  const out = await w.decodeShare(await w.encodeShare(token));
  eq(out.plans.length, 1, 'and still there once the recipient has decoded it');
  eq(out.plans[0].piId, null);
  eq(out.plans[0].availability, 60);
});

group('the reliable commitment — the other half of the spread');
/* The card had a mean and a min–max range, and neither answered the question a
   planning session asks next: how much of this can I actually commit to? A MEAN
   IS MET ABOUT HALF THE TIME BY DEFINITION, so the window also yields the largest
   commitment the team met in all but one of its sprints. A counted fact, not a
   percentile — over five sprints a percentile is an interpolation between two of
   the same five numbers dressed up as statistics. The fixture's window is
   [10, 20, 30, 40]: mean 25, second-lowest 20. */
t('the floor is the second-lowest result, and the count is real', () => {
  withState(capacityFixture(), () => {
    const t1 = w.nextSprintTarget('t1', false);
    approx(t1.reliableBase, 20);
    approx(t1.reliable, 20, 'unadjusted, so the same figure');
    eq(t1.reliableMet, 3, '20, 30 and 40 all cleared it — all but one, counted');
    eq(t1.meanMet, 2, 'and only two of the four cleared the mean, which is the point');
    eq(t1.hasFloor, true);
  });
});
t('it never moves the recommendation — that is still the mean', () => {
  withState(capacityFixture(), () => {
    approx(w.nextSprintTarget('t1', false).recommended, 25,

});
t('availability scales the floor exactly as it scales the recommendation', () => {
  withState(capacityFixture({
    plans: [{ id: 'pl1', teamId: 't1', piId: 'p1', sprintNumber: 5, availability: 60, reason: 'leave' }]
  }), () => {
    const t1 = w.nextSprintTarget('t1', false);
    approx(t1.recommended, 15);
    approx(t1.reliable, 12, 'both are outputs, so both move');
    approx(t1.reliableBase, 20, 'the basis stays on the history, for the card to quote');
    eq(t1.low, 10, 'and the raw range never moves with next sprint’s leave');

});
t('a scaled sprint moves the floor, because the floor is a planning figure', () => {

     figure would sit ABOVE the recommendation. There is no safer number to offer
     — the mean is already below what they usually do — so the pair is simply not
     shown. Clamping the floor to the recommendation would invent a figure none of
     their sprints support. */
  const fx = capacityFixture();
  fx.sprints = fx.sprints.slice(0, 3);
  [10, 30, 32].forEach((v, i) => {
    fx.sprints[i].committed = v; fx.sprints[i].committedCompleted = v; fx.sprints[i].totalCompleted = v;
  });
  withState(fx, () => {
    const t1 = w.nextSprintTarget('t1', false);
    approx(t1.recommended, 24);
    approx(t1.reliableBase, 30, 'the arithmetic is honest…');
    eq(t1.hasFloor, false, '…and the card declines to show it rather than reading as nonsense');
  });
});

group('piCapacityCard — the ART’s two figures, and which way round they go');
/* "Across the PI" is every team's recommendation; "If it has to hold" is meant to
   be the cautious one beside it. It summed `reliable` for every team — including
   the ones nextSprintTarget() flags `hasFloor: false` precisely because their
   second-lowest result sits ABOVE their mean — so the cautious total could come
   out LARGER than the central one, on the card an RTE plans a PI from. */
function artCapacityFixture(teams) {
  const sprints = [];
  teams.forEach(([id, done]) => done.forEach((v, i) => sprints.push({
    id: id + i, teamId: id, piId: 'p1', sprintNumber: i + 1,
    committed: Math.max(v, 45), committedCompleted: v, totalCompleted: v,
    added: 0, removed: 0, carriedIn: 0, carriedOut: 0, addedThenRemoved: 0,
  })));
  return {
    teams: teams.map(([id], i) => ({ id, name: 'Team ' + (i + 1), artId: 'a1' })),
    arts: [{ id: 'a1', name: 'ART One' }],
    pis: [{ id: 'p1', name: 'PI 1' }],
    plans: [], objectives: [], sprints,
  };
}
/* Three ordinary teams pulled down by one bad sprint each — mean below their own
   second-lowest, so no floor — beside one carried by a single big sprint, which is
   the only one that has one. Nothing exotic: this is a normal ART. */
const FLOOR_TRAP = [
  ['t1', [10, 30, 32, 31, 29]],
  ['t2', [12, 28, 30, 29, 31]],
  ['t3', [8, 26, 28, 27, 29]],
  ['t4', [4, 4, 4, 4, 10]],
];
/* The tile figures as the reader sees them. Read off the rendered markup rather
   than recomputed here, so the assertion is about what the card SAYS — the whole
   defect was a card printing two numbers the wrong way round. fmtNum groups
   thousands, so digits only. */
const tileFigures = (html) => {
  const doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  return [...doc.querySelectorAll('.tile')].map(el => ({
    label: el.querySelector('.label').textContent.trim(),
    value: Number(el.querySelector('.value').textContent.replace(/[^0-9]/g, '')),
  }));
};
t('three of the four teams have no floor at all, which is the trap', () => {
  withState(artCapacityFixture(FLOOR_TRAP), () => {
    const flags = w.svGet().teams.map(t => w.nextSprintTarget(t.id, false).hasFloor);
    eq(flags, [false, false, false, true],
      'a team dragged down by one bad sprint has no safer number to offer');
  });
});
t('the cautious total can never exceed the central one', () => {
  withState(artCapacityFixture(FLOOR_TRAP), () => {
    const rows = w.svGet().teams.map(t => w.nextSprintTarget(t.id, false));
    const slots = 5;
    const total = rows.reduce((a, r) => a + r.recommended * slots, 0);
    const floor = rows.reduce((a, r) => a + (r.hasFloor ? r.reliable : r.recommended) * slots, 0);
    ok(floor <= total, 'floor ' + Math.round(floor) + ' vs total ' + Math.round(total));
    const tiles = tileFigures(w.piCapacityCard(w.svGet().teams, false));
    const across = tiles.find(x => x.label.startsWith('Across the PI'));
    const hold = tiles.find(x => x.label.startsWith('If it has to hold'));
    eq(across.value, Math.round(total));
    eq(hold.value, Math.round(floor));
    ok(hold.value <= across.value,
      'the cautious tile read ' + hold.value + ' against ' + across.value + ' before this');
  });
});
t('and the card says how many teams actually brought a floor', () => {
  withState(artCapacityFixture(FLOOR_TRAP), () => {
    const html = w.piCapacityCard(w.svGet().teams, false);
    ok(html.includes('1 of 4 teams'), 'an exclusion is never silent, this one included');
  });
});
t('with every team carrying a floor the label stays the plain one', () => {
  const all = [['t1', [5, 5, 5, 5, 40]], ['t2', [6, 6, 6, 6, 44]]];
  withState(artCapacityFixture(all), () => {
    const flags = w.svGet().teams.map(t => w.nextSprintTarget(t.id, false).hasFloor);
    eq(flags, [true, true]);
    const html = w.piCapacityCard(w.svGet().teams, false);
    ok(html.includes('each team at the commitment it has met in all but one sprint'));
    eq(html.includes(' of 2 teams at the commitment'), false, 'nothing to qualify');

});

});

group('the sample data — the demo, and every feature reachable from it');
/* loadSample() confirms, saves, renders and toasts. The suite is read-only, so all
   four are stubbed for the length of the call and put back in a finally.

   These tests exist because the sample data is the app's DEMO — the thing a person
   sent a share link explores. Every finding below is ordinary-looking figures that
   a later edit could tidy, and tidying them would silently leave a first run with
   nothing to look at for that feature. A NEW FEATURE MEANS A NEW TEST HERE. */
function withSample(fn) {
  const real = { confirm: w.confirm, save: w.save, render: w.render, toast: w.toast };
  const st = w.svGet();
  const settings = { team: st.settings.activeTeamId, pi: st.settings.activePiId,
                     sprint: st.settings.activeSprintNum, view: st.settings.view };
  w.confirm = () => true; w.save = () => {}; w.render = () => {}; w.toast = () => {};
  try {
    return withState({ teams: [], arts: [], pis: [], sprints: [], plans: [], objectives: [] }, () => {
      w.loadSample();
      const by = (name) => st.teams.find(t => t.name === name);
      return fn(name => by(name).id, by);
    });
  } finally {
    Object.assign(w, real);
    st.settings.activeTeamId = settings.team;
    st.settings.activePiId = settings.pi;
    st.settings.activeSprintNum = settings.sprint;
    st.settings.view = settings.view;
  }
}
t('the roster is six teams, two ARTs of two, and two teams in neither', () => {

/* commitSprint() is NOT a pure function — it writes state and calls save(). The
   iframe shares this origin's localStorage with the real app, and the page header
   promises the suite saves nothing, so save() is stubbed out and the two settings
   commitSprint touches are put back. Everything else stays inside withState. */
function withCommitSprint(fx, fn) {
  const realSave = w.save;
  const st = w.svGet();
  const activePiId = st.settings.activePiId, activeSprintNum = st.settings.activeSprintNum;
  w.save = () => {};
  try { withState(fx, fn); }
  finally {
    w.save = realSave;
    st.settings.activePiId = activePiId;
    st.settings.activeSprintNum = activeSprintNum;
  }
}
t('commitSprint preserves the scale a form save cannot know about', () => {
  /* capacityScale is the one stored sprint field with NO input on the sprint form,
     because it belongs to capacity planning and is edited from Adjust Capacity.
     buildSprintRecord() rebuilds the whole record, so without this preservation a
     Save sprint or Jira re-paste would silently strip the scale. */
  const fx = capacityFixture();
  fx.sprints[0].capacityScale = 133;
  withCommitSprint(fx, () => {
    const edited = Object.assign({}, w.svGet().sprints.find(x => x.id === 's1'));
    delete edited.capacityScale;              // what buildSprintRecord() would hand over
    edited.committedCompleted = 12;
    ok(w.commitSprint(edited), 'the save itself succeeds');
    const after = w.svGet().sprints.find(x => x.id === 's1');
    eq(after.capacityScale, 133, 'the scale survives the edit');
    eq(after.committedCompleted, 12, 'and the edit itself lands');
  });
});
t('commitSprint never invents the key on a sprint that has no scale', () => {
  withCommitSprint(capacityFixture(), () => {
    const edited = Object.assign({}, w.svGet().sprints.find(x => x.id === 's1'));

       'absent stays absent — a key holding undefined stops the Firestore push');
  });
});

}

   code that worker had cached instead of the files on disk.

   What is worth asserting is therefore the SHAPE of the thing: that its cache
   list is only ever public files, and that it stays small and same-origin.
   Cache Storage is origin-wide, shared with Flow Metrics and financial-plan, so
   "nothing private is ever cached" is the single promise holding that up. */
group('Offline — the service worker');

/* Read once, here, because this is the first group that needs them and the
   runner walks the tests in declaration order. The newer-build group below
   pins index.html too and reuses APP_SRC rather than fetching it again. */
let SW_SRC = null, KILL_SRC = null, APP_SRC = null;
const stripComments = (s) => s.replace(/\/\*[\s\S]*?\*\//g, '').replace(/^\s*\/\/.*$/gm, '');

t('sw.js, its kill switch and the app all read back as text', async () => {
  const [a, b, c] = await Promise.all([bustFetch('sw.js'), bustFetch('sw-kill.js'), bustFetch('index.html')]);
  ok(a.ok, 'sw.js is missing');
  ok(b.ok, 'sw-kill.js is missing — the escape hatch has to exist BEFORE it is needed');
  ok(c.ok, 'index.html is missing');
  SW_SRC = await a.text(); KILL_SRC = await b.text(); APP_SRC = await c.text();
});

/* ── The footer every public page in this account carries ────────────────────
   The privacy policy, the repo under the label "How it works", and the
   authorship line. The APP's footer has had all three for a while; privacy.html
   carried none of them until 2026-08-21, and it is a public page reached by a
   link in that very footer — so somebody who follows it lands on a document
   with no way back to what it documents and no statement of who wrote it. The
   privacy link itself is deliberately absent: you are standing on that page. */
t('the privacy page carries the family footer', async () => {
  const res = await bustFetch('privacy.html');
  ok(res.ok, 'privacy.html is missing — the app footer links straight at it');
  const src = await res.text();
  ok(/>How it works</.test(src),
    'privacy.html must carry the repo link, labelled "How it works" family-wide');
  ok(/MIT licensed/.test(src),
    'and the authorship line every public page in the family has');
  /* NOTICE, not just LICENSE: a licence is the terms, NOTICE is who owns it —
     the distinction this repo's own footer comment records. */
  ok(/blob\/main\/NOTICE/.test(src),
    '"independent personal project" must point at NOTICE, as the app footer does');
  /* Comments stripped FIRST, and the footer matched by its CLASS. The notes
     beside both elements name them in prose — and one of those notes is in the
     <style> block, which an HTML-comment strip does not reach — so a bare
     /<main>/ or a bare '<footer' would pass on a page that had lost the element
     and kept the comment explaining it, which is the one way this could rot. */
  const bare = stripHtmlComments(src);
  /* Matched by the WRAPPER's class, never by a bare '<footer'. The note above
     says why and this is the second time it has bitten: a bare match passes on
     the prose in the <style> block's own comment, which an HTML-comment strip
     does not reach. `class="foot"` used to serve that purpose on the element
     itself; `.footnotes` serves it now. */
  ok(/<div class="footnotes">/.test(bare),
    'the footer is a real <footer> — a contentinfo landmark, not a styled paragraph');
  /* The wrapper is not decoration: `footer` is a flex ROW, so without it the
     paragraphs become flex items and lay out side by side. It carried
     `class="foot"` on the element itself until 2026-08-23, when every page in
     the family moved to this app's own footer treatment. */
  ok(/<p class="privacy privacy-links">/.test(bare),
    'and the lines wear .privacy, so they read the same as the app page\u2019s');
  ok(/<main>/.test(bare),
    'and the policy sits in <main>, or contentinfo would be the only landmark on the page');
  ok(bare.indexOf('</main>') < bare.indexOf('<div class="footnotes">'),
    'with main CLOSED before it: a <footer> inside main is not contentinfo at all');
  ok(!/href="privacy\.html"/.test(src),
    'and NOT a privacy link, which on the privacy page points at itself');
});

  /* Exact equality, not "contains". A new entry has to be added here too, which

  eq(shell.slice().sort(),

t('nothing private can reach the cache', () => {
  const m = SW_SRC.match(/const SHELL = \[([\s\S]*?)\]/);
  const shell = [...m[1].matchAll(/'([^']+)'/g)].map((x) => x[1]);
  /* The specific things that must never be cached: the suite itself (which
     boots the app), the repo's own notes, and anything holding figures. */
  const banned = [/\.json$/, /^tests\.html$/, /\.py$/, /CLAUDE/i, /README/i, /NOTICE/i, /data/i];
  for (const entry of shell)
    for (const pat of banned)
      ok(!pat.test(entry), `"${entry}" is on the shell list but must never be cached`);
});

t('the worker touches nothing cross-origin', () => {
  /* Guarded before the negations. Every assertion below is a NOT, and a NOT over
     an empty string passes — a file that failed to load would report green here. */
  ok(SW_SRC, 'sw.js did not load — the negations below would all pass on an empty string');
  const code = stripComments(SW_SRC);
  ok(!/https?:\/\//.test(code),
    'sw.js names an off-origin URL in executable code — it must only ever see this origin');
  /* No CSP applies to a worker on Pages, so these are not merely untidy here. */
  for (const bad of ['eval(', 'importScripts(', 'new Function('])
    ok(!code.includes(bad), `sw.js uses ${bad} — it runs with no CSP, so it must not`);

t('the worker deletes only its own caches', () => {
  const code = stripComments(SW_SRC);
  /* Cache Storage is origin-wide: an unguarded "delete every cache that is not
     mine" on activate would wipe Flow Metrics' or financial-plan's. */
  ok(/startsWith\(PREFIX\)/.test(code), "the activate handler must guard caches.delete with this app's prefix");
  ok(/const PREFIX = 'sv-shell-';/.test(SW_SRC), 'the prefix must be this app’s, not a sibling’s');
});

t('the worker is network-first, so cached code needs a failed network', () => {
  const code = stripComments(SW_SRC);
  ok(/Promise\.race/.test(code) && /cache\.match/.test(code),
    'expected the network-first race with a cache fallback');
  /* The tell for cache-first is answering from the cache before the network is
     tried at all. If that ever appears, the staleness argument has to be had
     again — see the reasoning at the top of sw.js. */
  ok(!/caches\.match\(req\)\s*\.then\(\s*\(?r\)?\s*=>\s*r\s*\|\|/.test(code),
    'this looks cache-first — the whole design rests on network-first');
  /* An answered-but-failed network is the third case: a transient 404/500 from
     Pages inside the race window must not beat a good cached shell. */
  ok(/!res\.ok && cached/.test(code),
    'a same-origin error reply with a cached copy in hand must serve the cache');
});

/* ══════════════════════════════════════════════════════════════════════════
   Sync was removed on 2026-08-20, in the same sweep as Flow Metrics. This app
   holds figures copied out of a work Jira, and the point of removing it is that
   the ONLY copy of them is now the one in this browser — so "the code is gone"
   is not the assertion worth making. The assertion worth making is that the
   page cannot reach the network AT ALL, stated the way a browser enforces it.

   Written against the source rather than against behaviour on purpose: a
   sign-in that silently fails to start would pass a behavioural test just as
   well as a sign-in that isn't there.
   ══════════════════════════════════════════════════════════════════════════ */
/* index.html with EVERY comment removed — HTML and JS, block and line — so the
   checks below read the app's code rather than its prose. Stripped to a FIXED
   POINT rather than in one pass, because `<!--<!-- x -->` leaves a bare `<!--`
   behind: a half-stripped source would quietly let a word through and take the
   tripwire with it. Each pass strictly shortens the string, so it terminates.

   Comments are exempt on purpose: the note where the sync module used to be
   names Firebase, Firestore and the old hooks, so that somebody grepping this
   repo for "firebase" lands on the explanation rather than on nothing. A
   comment cannot open a socket, and the CSP test is what actually guarantees
   that — these make a paste-back loud. */
function appCode() {
  const stripAll = (src, re) => {
    let prev;
    do { prev = src; src = src.replace(re, ''); } while (src !== prev);
    return src;
  };
  return stripAll(stripAll(APP_SRC, /<!--[\s\S]*?-->/g), /\/\*[\s\S]*?\*\//g)
    .replace(/^\s*\/\/.*$/gm, '');
}

t('the CSP names no external origin at all', () => {
  const csp = APP_SRC.match(/http-equiv="Content-Security-Policy" content="([^"]+)"/)[1];
  /* THE test. Not "no Firebase" — no off-origin ANYTHING. A policy that admits
     one host is a policy that will admit a second, and the whole value of this
     one is that the list is empty and visibly so. */
  ok(!/https?:\/\//.test(csp), 'the CSP must name no external origin — not one host, anywhere: ' + csp);
  ok(/default-src 'none'/.test(csp), "default-src must be 'none', so anything unlisted is refused");
  ok(/connect-src 'none'/.test(csp),
    "connect-src must be spelled out as 'none' rather than left to the default — it is the "
    + 'one directive that would carry work data off the device');
  ok(/frame-src 'none'/.test(csp), 'nothing may be framed — the sign-in popup is gone');
});

});

/* ── A copy from a newer build ──────────────────────────────────────────────
   The braces to the service worker's belt. Cached code can be a build behind,
   and sync — or a restore, or a link — can hand that build data a newer one
   wrote. sanitizeIds() would strip the fields it has never heard of and the
   next edit would push the stripped copy back, so the app refuses instead.

   The halt itself is pinned as SOURCE rather than run: it draws a card over the
   whole frame and THROWS, which would take the rest of the suite down with it.
   What is asserted is that the guard exists, that it sits before the code that
   would strip or swallow it, and that it reuses the one write chokepoint. */
group('Booting with a saved copy — the path nothing else here exercises');
/* Every other test in this file calls the app's functions AFTER it has booted,
   with the whole file initialised. That misses the one thing the app does more
   often than anything else: read your saved data at startup.

   It matters because `let state = load()` sits several hundred lines ABOVE the
   domain helpers, so anything sanitizeIds() reaches for down there is still in its
   temporal dead zone. A `piKey()` call added to the plans dedupe threw a
   ReferenceError on every boot that had a capacity adjustment saved — load()'s own
   catch turned it into a blank state, the app opened on the welcome card as though
   the data were gone, and the next save would have written the blank over it. 291
   green tests said nothing, because by the time they ran piKey was initialised.

   So these boot a REAL iframe with a copy already in localStorage, which is the
   only way to see it. The developer's own local data is snapshotted and put back
   afterwards — the suite's read-only promise covers this key too, and unlike the
   dead sync keys the sync test writes, sv-data is the real thing. */
function bootWithSavedCopy(saved) {
  const before = localStorage.getItem('sv-data');
  localStorage.setItem('sv-data', JSON.stringify(saved));
  const f = document.createElement('iframe');
  f.setAttribute('data-sv-tests', '');
  f.setAttribute('aria-hidden', 'true');
  f.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;border:0;left:-9999px';
  return new Promise((resolve) => { f.onload = resolve; f.src = 'index.html' + BUST; document.body.appendChild(f); })
    .then(() => {
      /* Read before the restore, so a failing assertion can't leave the fixture in
         place — and the restore runs whether the assertions pass or not. */
      const got = f.contentWindow.svGet();
      const snapshot = JSON.parse(JSON.stringify({ teams: got.teams, pis: got.pis,
        sprints: got.sprints, plans: got.plans, objectives: got.objectives, arts: got.arts }));
      f.remove();
      return snapshot;
    })
    .finally(() => {
      if (before === null) localStorage.removeItem('sv-data');
      else localStorage.setItem('sv-data', before);
    });
}
const savedCopy = (extra) => Object.assign({
  version: w.__svTestHooks.SCHEMA,
  teams: [{ id: 't1', name: 'Kestrel' }],
  arts: [],
  pis: [{ id: 'p1', name: 'PI 1' }],
  sprints: [{ id: 's1', teamId: 't1', piId: 'p1', sprintNumber: 1,
    committed: 30, committedCompleted: 28, totalCompleted: 31, added: 3,
    removed: 0, carriedIn: 2, carriedOut: 2, addedThenRemoved: 0 }],
  plans: [], objectives: [],
  settings: { activeTeamId: 't1', activePiId: 'p1', view: 'sprint' },
}, extra || {});

t('nothing on the boot path reaches a const declared below it', async () => {
  /* The rule the fault broke, checked directly rather than only through its
     symptoms — a future edit to sanitizeIds() has the same trap waiting. Names
     declared after `let state = load()` are in their temporal dead zone while it
     runs, so calling one throws and the catch hands back a blank state. */
  const bootAt = APP_SRC.indexOf('let state = load();');
  ok(bootAt > -1, 'boot line has moved — recheck this test');
  const below = APP_SRC.slice(bootAt);
  const late = new Set();
  const decl = /^(?:const|let)\s+([A-Za-z_$][\w$]*)\s*=/gm;
  let m;
  while ((m = decl.exec(below))) late.add(m[1]);
  /* sanitizeIds' body, comments stripped so its own prose about piKey doesn't
     count as a use. */
  const start = APP_SRC.indexOf('function sanitizeIds(data) {');
  let depth = 0, i = start, seen = false;
  while (i < APP_SRC.length) {
    const ch = APP_SRC[i];
    if (ch === '{') { depth++; seen = true; }
    else if (ch === '}') { depth--; if (seen && depth === 0) break; }
    i++;
  }
  const body = APP_SRC.slice(start, i + 1)
    .replace(/\/\*[\s\S]*?\*\//g, ' ')
    .replace(/\/\/[^\n]*/g, ' ')
    /* String literals too: `kind === 'num'` is not a use of the `num` helper. */
    .replace(/'[^'\n]*'|"[^"\n]*"/g, ' ');
  const used = [...late].filter(n => new RegExp('(?<![\\w$.])' + n + '\\b').test(body));
  eq(used, [], 'sanitizeIds() must not reference these — write the rule out instead');
});

group('A copy from a newer build');

t('a blank state is stamped with the format this build understands', () => {
  eq(w.blankState().version, w.__svTestHooks.SCHEMA);
});

t('the halt fires above the current version and not at or below it', () => {
  /* The comparison the guard makes, asserted directly — an off-by-one here
     would either halt on every ordinary load or never halt at all. */
  const S = w.__svTestHooks.SCHEMA;
  const halts = (v) => Number(v || 1) > S;
  ok(!halts(S), 'must not halt on data this build wrote');
  ok(!halts(S - 1), 'must not halt on older data — the boundary already handles that');
  ok(!halts(undefined), 'data with no version at all is old, not new');
  ok(halts(S + 1), 'must halt on data from a newer build');
});

t('the halt refuses to write, and stops the worker registering too', () => {
  /* It reuses viewOnly rather than inventing a second flag, so the promise is
     only as good as that flag still being the write chokepoint. */
  ok(/viewOnly = true;\n  window\.svViewOnly = true;/.test(APP_SRC),
    'haltForNewerData must set viewOnly and its window mirror, the existing no-write guards');
  ok(/if \(viewOnly\) return;/.test(APP_SRC), 'save\(\) must still be a no-op under viewOnly');
  ok(/if \(window\.svViewOnly\) return;/.test(APP_SRC),
    'and the service-worker block must still refuse to register under it');
});

t('load() checks before the try whose catch would hand back a blank state', () => {
  /* That catch returns blankState(), which is right for corrupt JSON and
     catastrophic here: a blank state the app then SAVES would overwrite the
     good copy with nothing. Anchored on the catch's own try rather than on the
     first `try {`, because the guard's one-line try for the peek precedes it. */
  const guardAt = APP_SRC.indexOf('haltForNewerData(peek.version)');
  const tryAt = APP_SRC.indexOf('try {\n    const raw = localStorage.getItem(STORAGE_KEY);');
  ok(guardAt > -1, 'load() must call haltForNewerData');
  ok(tryAt > -1, "load()'s main try block has moved — recheck this test");
  ok(guardAt < tryAt, 'the guard must run BEFORE the try whose catch returns a blank state');
  /* Read raw, or sanitizeIds strips the very fields that make it newer. */
  const coerceAt = APP_SRC.indexOf('sanitizeIds(coerceShape(JSON.parse(raw)))');
  ok(coerceAt > -1 && guardAt < coerceAt, 'the guard must run before coerceShape/sanitizeIds');
});

/* svAdopt() had a test of its own here: it stored a newer copy VERBATIM before
   halting, because a document arriving from another device really was the newest
   copy in existence and belonged in localStorage for the fresh build to read. It
   went with sync on 2026-08-20, along with the only reason for that behaviour.
   Two doors are left for a copy from a newer build — boot's load(), and Restore
   from a file — and both are pinned above and below. */

t('the Restore path refuses a backup from a newer build, without halting', () => {
  /* The handler is FileReader UI all the way down, so pin the source. Nothing
     has arrived yet and what is on screen is still good, so this one refuses
     the file rather than stopping the app. */
  const at = APP_SRC.indexOf('JSON.parse(reader.result)');
  ok(at > -1, 'the restore handler has moved — recheck this test');
  const body = APP_SRC.slice(at, at + 2000);
  const guard = body.search(/Number\(rawParsed\.version \|\| 1\) > SCHEMA/);
  const coerce = body.indexOf('sanitizeIds(coerceShape(rawParsed))');
  ok(guard > -1, 'the restore handler must refuse a version newer than this build');
  ok(coerce > -1, 'the restore handler must still coerce the raw parse — has it moved?');
  ok(guard < coerce, 'the refusal must come before coerceShape sees the file');
  ok(!/haltForNewerData/.test(body), 'a refused file must not stop the app the user is using');
});

t('a share link from a newer build is refused, and says so', async () => {

group('the tile’s left edge');

/* 6px, matching Flow Metrics, where the same edge went up when its tiles moved
   onto the card surface and it became the only thing telling a tile from a card.
   Here it is a mirror of a chrome rule rather than a fix for anything, and the
   background it sits on deliberately did NOT come with it — see the note above
   `.tile` in index.html for why the two apps part company on that.

   Pinned as a RELATIONSHIP, not at 6px, exactly as the sibling pins it: the
   number is a judgement and may be tuned again, but an edge that has stopped
   outweighing the border it sits in has stopped being an edge.

   Probed on a detached element rather than a rendered view: this suite boots an
   app with no teams, so there is no tile on screen to measure, and a probe reads
   the same stylesheet either way. */
t('the left edge outweighs the other three, so it reads as a mark', () => {
  const probe = w.document.createElement('div');
  probe.className = 'tile';
  w.document.body.appendChild(probe);
  try {
    const cs = w.getComputedStyle(probe);
    const left = parseFloat(cs.borderLeftWidth), rest = parseFloat(cs.borderTopWidth);
    ok(left > rest * 2, 'left ' + cs.borderLeftWidth + ' against ' + cs.borderTopWidth);
    /* And the RAG states still take that width from `.tile` rather than setting
       their own, so a tuned edge can never apply to four tiles out of five. */
    probe.className = 'tile red';
    eq(w.getComputedStyle(probe).borderLeftWidth, cs.borderLeftWidth,
      'a RAG tile takes the same edge — it sets the colour, never the width');
  } finally {
    probe.remove();
  }
});

group('the manage dialog — rows are edited in place');
/* Rename buttons and their prompt() are gone: a name is edited in the row it
   sits in, and Delete is the same × Flow Metrics uses. Pinned because the shape
   of this dialog is now a rule shared across the two apps rather than a
   preference — see the Teams & ARTs window there.

   Rendered from a fixture through withState rather than from whatever the app
   happens to hold: the suite boots an app with no teams in it, and renderManage
   only writes these tables when it runs. It writes nothing to storage, so the
   read-only promise at the top of this page still holds; the last line puts the
   real rows back. */

  teams: [{ id: 'ft1', name: 'One', artId: 'fa1' }, { id: 'ft2', name: 'Two' },

group('esc — the free-text boundary (a team, ART or PI name reaching innerHTML)');
/* `sanitizeIds` above has had hostile-input tests since it was written; this
   boundary had none, here and in three siblings, which an audit found on
   2026-08-20. A crafted id was proved to be replaced, while `esc` — the function
   between a team or PI NAME and the markup of every picker, toolbar and table —
   was never called by the suite. Names are free text capped at 120 characters
   and deliberately not sanitized on the way in, because escaping at the sink is
   the design; so the sink is what has to be pinned. They also travel in share
   links, which is the one place the text is not something you typed yourself.
   It matters beyond this app: every GitHub Pages site in this account shares one
   browser origin, so a hole here is a hole in Flow Metrics too. */
t('every HTML-significant character is replaced', () => {
  eq(w.__svTestHooks.esc('<>&"\''), '&lt;&gt;&amp;&quot;&#39;');
});
t('a hostile team name survives as text and never as markup', () => {
  const evil = '"><img src=x onerror=alert(1)><script>alert(2)<\/script>';
  const e = w.__svTestHooks.esc(evil);
  /* Parsed for real rather than string-matched: the question is what a BROWSER
     builds from this, in an attribute as much as in text — `opt()` puts a name
     in a <option value="…"> and the manage table puts ids in data- attributes.
     A regex over the output would pass on markup the parser still accepts. */
  const probe = document.createElement('div');
  probe.innerHTML = '<span title="' + e + '">' + e + '</span>';
  eq(probe.querySelectorAll('img, script').length, 0, 'no element may be created');
  eq(probe.firstElementChild.textContent, evil, 'and the text reads back unchanged');
  eq(probe.firstElementChild.getAttribute('title'), evil, 'including inside an attribute');
});
t('null, undefined and numbers are handled, not thrown on', () => {
  eq(w.__svTestHooks.esc(null), '');
  eq(w.__svTestHooks.esc(undefined), '');
  eq(w.__svTestHooks.esc(7), '7');
});

group('PI business value — the predictability measure');
/* SAFe's own measure, and the app's only two-sided figure. The arithmetic is
   three numbers, so what is worth pinning is the ASYMMETRY: stretch counts in
   what was delivered and never in what was committed. Get that backwards and a
   team is penalised for planning stretch objectives at all — which is the exact
   opposite of what they are for. */
t('stretch counts in the numerator and never in the denominator', () => {
  const bv = w.bvFigures({ plannedBv: 30, actualBv: 28, stretchBv: 6 });
  eq(bv.planned, 30, 'the commitment is what was committed — stretch is not in it');
  eq(bv.delivered, 34, '28 committed value landed, plus 6 from stretch');
  approx(bv.pct, 34 / 30 * 100);
  ok(bv.pct > 100, 'which is how an honest measure sits above 100%');
});
t('nothing planned is null, not 0% — the same rule as every other percentage', () => {
  eq(w.bvFigures({ plannedBv: 0, actualBv: 0, stretchBv: 0 }).pct, null);
  eq(w.bvFigures({ plannedBv: 0, actualBv: 9, stretchBv: 0 }).pct, null,
    'value delivered against no plan still has no denominator to divide by');
  eq(w.bvFigures(null).pct, null, 'and a team with no record at all');
});
t('absent figures read as 0, like every other blank in the app', () => {
  const bv = w.bvFigures({ plannedBv: 20 });
  eq(bv.actual, 0); eq(bv.stretch, 0); eq(bv.delivered, 0);
  approx(bv.pct, 0);
});
t('hasBv tells "planned nothing" apart from "nobody has filled this in"', () => {
  const hasBv = w.__svTestHooks.hasBv;
  eq(hasBv(null), false, 'no record — the ART view shows "not scored"');
  eq(hasBv({ plannedBv: 0, actualBv: 0, stretchBv: 0 }), false);
  eq(hasBv({ plannedBv: 0, actualBv: 0, stretchBv: 3 }), true,
    'stretch alone is still a score somebody entered');
});

group('the predictability BAND — a figure can miss it from either side');
/* Every other scale in this app is one-sided. This one is not, and the whole
   point is that well over 100% is a finding: the train committed to less than it
   could deliver, and every dependency planned around that commitment was wrong by
   the difference. Pinned against the app's OWN figures rather than against four
   numbers copied out of them — and read through tgt(), because the band became a
   setting on 2026-08-22 and a suite holding a copy of the old defaults would pass
   while the app judged by something else entirely. */
const P = () => w.__svTestHooks;
t('inside the band is green, at both edges', () => {
  eq(w.rag(P().tgt().predLow, 'predictability'), 'green');
  eq(w.rag(P().tgt().predHigh, 'predictability'), 'green');
  withTargets(null, () => eq(w.rag(90, 'predictability'), 'green'));
});
t('under the band: amber, then red below the floor', () => {
  eq(w.rag(P().tgt().predLow - 0.01, 'predictability'), 'yellow');
  eq(w.rag(P().tgt().predUnderRed, 'predictability'), 'yellow');
  eq(w.rag(P().tgt().predUnderRed - 0.01, 'predictability'), 'red');
});
t('over the band too — over-delivery is a finding, not a triumph', () => {
  eq(w.rag(P().tgt().predHigh + 0.01, 'predictability'), 'yellow');
  eq(w.rag(P().tgt().predOverRed, 'predictability'), 'yellow',
    'a couple of stretch objectives landing is what stretch is for');
  eq(w.rag(P().tgt().predOverRed + 0.01, 'predictability'), 'red',
    'too big to be stretch — the plan was wrong by that much');
});
t('nothing recorded is none, never 0', () => {
  eq(w.rag(null, 'predictability'), 'none');
});
t('the spoken status says WHICH side, because "Off target" cannot', () => {
  const st = w.predictabilityStatus;
  ok(st(40).startsWith('Below'), '40% — ' + st(40));
  ok(st(140).startsWith('Above'), '140% — ' + st(140));
  ok(/^In the/.test(st(90)), '90% — ' + st(90));
  eq(st(null), 'Not recorded');
});
t('fmtPct keeps a decimal at the band edges too, both of them', () => {
  withTargets(null, () => {
    const fmtPct = P().fmtPct;
    eq(fmtPct(79.6, 'predictability'), '79.6%', '80% beside an amber flag would lie');
    eq(fmtPct(100.4, 'predictability'), '100.4%', 'and so would 100% beside one');
    eq(fmtPct(90.2, 'predictability'), '90%', 'inside the band it rounds as usual');

});

group('artPredictability — the train figure, both methods');
/* The ART view is the one place an ART is a level of arithmetic rather than a
   label. The two methods are the same deliberate pair as avg()/pooled(): SAFe
   defines the measure as the average of the teams', and pooling answers the other
   question. They must be able to disagree, and unscored teams must be NAMED. */
function bvFixture() {
  return {
    teams: [{ id: 't1', name: 'A' }, { id: 't2', name: 'B' }, { id: 't3', name: 'C' }],
    arts: [], pis: [{ id: 'p1', name: 'PI 1' }], sprints: [], plans: [],
    objectives: [
      { id: 'o1', teamId: 't1', piId: 'p1', plannedBv: 10, actualBv: 10, stretchBv: 0 },
      { id: 'o2', teamId: 't2', piId: 'p1', plannedBv: 90, actualBv: 45, stretchBv: 0 },
    ]
  };
}
t('mean counts every team once; pooled lets the bigger plan pull harder', () => {
  withState(bvFixture(), () => {
    const st = w.svGet();
    const pred = w.artPredictability(st.teams, 'p1');
    approx(pred.mean, 75, '100% and 50%, averaged — every team once');
    approx(pred.pooled, 55, '55 of 100 — the 90-point plan pulls harder');
  });
});

group('CSV export — the formula guard and the quoting');
/* A spreadsheet treats a cell opening with =, + or @ as a FORMULA, so a team name
   is executable the moment somebody opens the file. The app escapes everything it
   renders to HTML for the same class of reason; a CSV is just another place text
   goes somewhere it can be interpreted. */
t('a cell that would run as a formula is defused with a leading apostrophe', () => {
  eq(w.__svTestHooks.csvCell('=1+1'), "'=1+1");
  eq(w.__svTestHooks.csvCell('+SUM(A1)'), "'+SUM(A1)");
  eq(w.__svTestHooks.csvCell('@import'), "'@import");
  eq(w.__svTestHooks.csvCell('=cmd|\' /c calc\'!A1'), "'=cmd|' /c calc'!A1",
    'the classic DDE payload — apostrophes need no CSV quoting, only the guard');
  eq(w.__svTestHooks.csvCell('=A1,B2'), '"\'=A1,B2"',
    'guarded first, then quoted because of the comma');
});
t('a real negative number is left alone — quoting it would break the arithmetic', () => {
  eq(w.__svTestHooks.csvCell('-5'), '-5');
  eq(w.__svTestHooks.csvCell('-0.5'), '-0.5');

});
t('the thousands separator is quoted, or the row silently gains a column', () => {
  /* fmtNum() groups with a comma in most locales, so a four-figure points total
     reaches the CSV as 1,234. This is the bug that would look like corrupt data. */
  eq(w.__svTestHooks.csvCell('1,234'), '"1,234"');
  eq(w.__svTestHooks.toCsv([['a', '1,234'], ['b', '2']]), 'a,"1,234"\r\nb,2');

t('quotes are doubled, newlines force quoting, and plain text is untouched', () => {

     paste as a grid — a pasted CSV lands as one column and needs Text to Columns. */

group('forecast — how many sprints for X points');
/* The capacity card fixes the sprint and asks how much fits; this fixes the work
   and asks how many sprints. The fixture's window is [10, 20, 30, 40]: mean 25,
   second-lowest 20 — so 100 points is 4 sprints at the mean and 5 at the floor. */
t('it returns a RANGE, from the same two rates the capacity card shows', () => {
  withState(capacityFixture(), () => {
    const f = w.forecast('t1', 100, false);
    eq(f.fast, 4, '100 at 25 a sprint');
    eq(f.slow, 5, '100 at the 20 they hit in all but one');
    approx(f.meanRate, 25);
    approx(f.floorRate, 20);
  });
});
t('THE RATE IS COMMITTED POINTS FINISHED, NEVER VELOCITY', () => {
  /* The stance the whole app is built on, stated here as a number. Velocity
     counts break-in, which by definition is not the work being forecast — at
     velocity this team would read 3 sprints for work that takes them 5. */
  const fx = capacityFixture();
  fx.sprints.forEach(sp => {
    sp.committed = 20; sp.committedCompleted = 20;
    sp.totalCompleted = 40; sp.added = 20;      // half of every sprint is break-in
  });
  withState(fx, () => {
    const f = w.forecast('t1', 100, false);
    approx(f.meanRate, 20, 'not 40 — the break-in is not this piece of work');
    eq(f.fast, 5, 'forecasting at velocity would have said 3');
  });
});
t('sprints are whole, and it rounds UP — you do not finish in 4.4 of them', () => {
  withState(capacityFixture(), () => {
    const f = w.forecast('t1', 110, false);
    eq(f.fast, 5, 'ceil(110 / 25)');
    eq(f.slow, 6, 'ceil(110 / 20)');
  });
});

  withState(capacityFixture(), () => {
    eq(w.forecast('t1', 0, false), null);
    eq(w.forecast('t1', -5, false), null);
    eq(w.forecast('nobody', 100, false), null, 'a team with no window at all');
  });
  const fx = capacityFixture();
  fx.sprints.forEach(sp => { sp.committedCompleted = 0; });
  withState(fx, () => {
    eq(w.forecast('t1', 100, false).impossible, true,

t('a STANDING availability holds across the horizon; a one-off does not', () => {
  const standing = capacityFixture();
  standing.teams = [{ id: 't1', name: 'Team One', availability: 50, availabilityReason: 'teamChange' }];
  withState(standing, () => {
    const f = w.forecast('t1', 100, false);
    approx(f.meanRate, 12.5, 'someone left — that holds for every sprint here');
    eq(f.fast, 8);

  });

  }), () => {

t('the range stays the right way round for a team dragged down by one sprint', () => {
  /* [10, 30, 32]: the mean is 24 and the second-lowest is 30, so the FLOOR is the
     faster rate here. Taking min/max rather than assuming which is which is what
     keeps `slow` from coming out below `fast`. */
  const fx = capacityFixture();
  fx.sprints = fx.sprints.slice(0, 3);
  [10, 30, 32].forEach((v, i) => {
    fx.sprints[i].committed = v; fx.sprints[i].committedCompleted = v; fx.sprints[i].totalCompleted = v;
  });
  withState(fx, () => {
    const f = w.forecast('t1', 120, false);
    ok(f.fast <= f.slow, `fast ${f.fast} must not exceed slow ${f.slow}`);
    eq(f.fast, 4, 'ceil(120 / 30) — the floor is the faster rate for this team');
    eq(f.slow, 5, 'ceil(120 / 24)');
  });
});

group('piTrend — one row per PI, for the Inspect & Adapt view');
/* The only PI-grained view over time. Every other one looks at a single PI or at a
   fixed five-sprint window, so this is where "are we getting better?" lives — and
   the trap it has to avoid is comparing PIs that covered different teams as though
   they were the same train. */
function trendFixture() {
  const sp = (team, pi, n, committed, done, total) => ({
    id: team + pi + n, teamId: team, piId: pi, sprintNumber: n,
    committed, committedCompleted: done, totalCompleted: total,
    added: 0, removed: 0, carriedIn: 0, carriedOut: committed - done, addedThenRemoved: 0 });
  return {
    teams: [{ id: 'a', name: 'A' }, { id: 'b', name: 'B' }],
    arts: [], plans: [],
    pis: [{ id: 'p1', name: 'PI 1' }, { id: 'p2', name: 'PI 2' }, { id: 'p3', name: 'PI 3' }],
    sprints: [
      /* PI 1: team A only. PI 2: A and B. PI 3: nothing at all. */
      sp('a', 'p1', 1, 20, 16, 17), sp('a', 'p1', 6, 20, 20, 20),
      sp('a', 'p2', 1, 20, 18, 19), sp('b', 'p2', 1, 10, 9, 9)
    ],
    objectives: [
      { id: 'o1', teamId: 'a', piId: 'p1', plannedBv: 20, actualBv: 14, stretchBv: 0 },  // 70%
      { id: 'o2', teamId: 'a', piId: 'p2', plannedBv: 20, actualBv: 18, stretchBv: 0 },  // 90%
      { id: 'o3', teamId: 'b', piId: 'p2', plannedBv: 10, actualBv: 7, stretchBv: 0 }    // 70%
    ]
  };
}
t('each PI is measured over the teams that were actually IN it', () => {
  withState(trendFixture(), () => {
    const st = w.svGet();
    const rows = w.piTrend(st.teams, false);
    eq(rows.map(r => r.pi.name), ['PI 1', 'PI 2', 'PI 3'], 'oldest first, in PI order');
    eq(rows[0].teamsIn.map(t => t.name), ['A'], 'B did not exist yet');
    eq(rows[1].teamsIn.map(t => t.name), ['A', 'B']);
    eq(rows[2].teamsIn.length, 0);
  });
});
t('predictability is the mean of those teams, so a growing train is comparable', () => {
  withState(trendFixture(), () => {
    const st = w.svGet();
    const rows = w.piTrend(st.teams, false);
    approx(rows[0].predPct, 70, 'one team at 70%');
    approx(rows[1].predPct, 80, '90% and 70%, averaged — not pooled, so B’s smaller plan counts once');
  });
});
t('the IP sprint is left out, so a PI’s delivery figures are not diluted by it', () => {
  withState(trendFixture(), () => {
    const st = w.svGet();
    eq(w.piTrend(st.teams, false)[0].sprints, 1, 'PI 1 has S1 and S6; only S1 delivers');
    eq(w.piTrend(st.teams, true)[0].sprints, 2, 'unless you ask for it');
  });
});
t('a PI with nothing recorded is a gap in the history, not a zero', () => {
  withState(trendFixture(), () => {
    const st = w.svGet();
    const rows = w.piTrend(st.teams, false);
    eq(rows[2].any, false, 'so the view drops it rather than plotting a hole as a collapse');
    eq(rows[0].any, true);
    eq(rows[1].any, true);
  });
});
t('an unscored PI has a null measure, never a zero', () => {
  const fx = trendFixture();
  fx.objectives = [];
  withState(fx, () => {
    const st = w.svGet();
    eq(w.piTrend(st.teams, false)[0].predPct, null,
      'no business value recorded is not 0% predictability');
    ok(w.piTrend(st.teams, false)[0].any, 'but the PI still has sprints, so it stays on the page');
  });
});
t('points figures are pooled totals, and move with the size of the train', () => {
  withState(trendFixture(), () => {
    const st = w.svGet();
    const rows = w.piTrend(st.teams, false);
    eq(rows[1].committed, 30, 'A’s 20 plus B’s 10');
    approx(rows[1].commitPct, 27 / 30 * 100, 'pooled — the Current PI and Dashboard method');
  });
});
t('a PI-less sprint never lands in any PI’s row', () => {
  const fx = trendFixture();
  fx.sprints.push({ id: 'x', teamId: 'a', piId: null, sprintNumber: 12,
    committed: 99, committedCompleted: 99, totalCompleted: 99,
    added: 0, removed: 0, carriedIn: 0, carriedOut: 0, addedThenRemoved: 0 });
  withState(fx, () => {
    const st = w.svGet();
    const rows = w.piTrend(st.teams, false);
    eq(rows.reduce((a, r) => a + r.committed, 0), 20 + 30,
      'the 99 is on the unassigned track and belongs to no PI');
  });
});

group('PIs are optional — the unassigned track');
/* A team's sprints live on one of two tracks: the unassigned track (`piId: null`),
   which is the app's pre-history, or a PI's. The unassigned track sorts before
   every PI, is numbered continuously, and the IP-sprint rule does not exist on it.
   Everything in this group is that one sentence, checked. */
const H = () => w.__svTestHooks;
function mixedFixture() {
  const sp = (id, piId, n) => ({ id, teamId: 't1', piId, sprintNumber: n,
    committed: 20, committedCompleted: 18, totalCompleted: 19,
    added: 0, removed: 0, carriedIn: 0, carriedOut: 2, addedThenRemoved: 0 });
  return {
    teams: [{ id: 't1', name: 'A' }], arts: [], plans: [], objectives: [],
    pis: [{ id: 'p1', name: 'PI 1' }],
    sprints: [sp('b', 'p1', 1), sp('a2', null, 13), sp('a1', null, 12)]
  };
}
t('an unassigned sprint sorts BEFORE every sprint that is in a PI', () => {
  withState(mixedFixture(), () => {
    eq(w.teamSprints('t1').map(s => s.id), ['a1', 'a2', 'b'],
      'pre-history first, in its own number order, then the PI');
  });
});
t('piRank says it outright rather than leaning on findIndex returning -1', () => {
  withState(mixedFixture(), () => {
    eq(H().piRank(null), -1);
    eq(H().piRank(''), -1, 'every way of saying "no PI" ranks the same');
    eq(H().piRank('p1'), 0, 'and a real PI ranks by its place in the list');
  });
});
t('piKey collapses null, undefined and the empty string to one value', () => {
  const piKey = H().piKey;
  eq(piKey(null), null); eq(piKey(undefined), null); eq(piKey(''), null);
  eq(piKey('p1'), 'p1');
});
t('findSprint matches an unassigned sprint however "no PI" is spelled', () => {
  withState(mixedFixture(), () => {
    /* The form hands back '' from its none-option while the store holds null. Without
       piKey on both sides the save path would write a duplicate instead of editing
       the sprint in front of you. */
    ['', null, undefined].forEach(v =>
      eq(w.findSprint('t1', v, 12).id, 'a1', 'looked up with ' + JSON.stringify(v)));
  });
});
t('the IP-sprint rule applies inside a PI and NOWHERE else', () => {
  const isIpSlot = H().isIpSlot;

});

t('running off the end of the last PI does not land on the team’s oldest slot', () => {
  /* The fallback for "no PI after this one" named slot 1 of the unassigned track.
     That was harmless while `piId: null` meant "we can't say"; once a PI became
     optional it names the team's PRE-PI HISTORY, where slot 1 is a real sprint —
     so the capacity card aimed at it, picked up that old sprint's availability,
     and Adjust Capacity would have written a second plan onto the same slot. */
  const sp = (piId, n) => ({ id: 's' + piId + n, teamId: 't1', piId, sprintNumber: n,
    committed: 20, committedCompleted: 18, totalCompleted: 18,
    added: 0, removed: 0, carriedIn: 0, carriedOut: 2, addedThenRemoved: 0 });
  withState({
    teams: [{ id: 't1', name: 'A' }], arts: [], objectives: [],
    pis: [{ id: 'p1', name: 'PI 1' }],
    sprints: [sp(null, 1), sp(null, 2), sp(null, 3), sp('p1', 5), sp('p1', 6)],
    /* The adjustment that used to be picked up: it belongs to the pre-PI S1. */
    plans: [{ id: 'pl1', teamId: 't1', piId: null, sprintNumber: 1,

    eq(slot.sprintNumber, 4, 'one past the highest number already out there');
    eq(w.findSprint('t1', slot.piId, slot.sprintNumber), null,
      'so the slot being planned is empty, not a sprint recorded years ago');
    eq(w.nextSprintTarget('t1', false).availabilitySource, null,
      'and the old sprint\u2019s 40% is not applied to next sprint');

});
