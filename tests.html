<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<!-- Every page on the shared origin ships a CSP (the family security rule) —
     this one is published on GitHub Pages beside the app, so it is as much a
     page on the origin as index.html is. It needs: its own inline script and
     styles, the same-origin stylesheet, connect-src 'self' to read index.html
     as text (the halt can't be run live — see the newer-build group), plus
     api.github.com for the CI-scorecard line, and frame-src 'self' for the
     harness iframe (whose content is then governed by index.html's own CSP,
     not this one). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self' https://api.github.com; frame-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint Velocity — Tests</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Dev-only page: pins the pure functions in index.html. It loads the real app
     in a hidden same-origin iframe and calls its functions directly, so what's
     tested is exactly what ships — no copies, no build step. Serve over
     http://localhost (python3 -m http.server 8012); file:// iframes are blocked
     in some browsers. Nothing here writes localStorage or calls save().

     But the iframe boots the real app, which is not nothing: on an origin that
     has signed in, the sync module would start a live Firestore session inside
     an invisible frame. Two guards, and both are needed. The iframe carries
     data-sv-tests, which index.html checks so sync never initialises in the
     harness. And the gate at the foot of this script refuses to create the
     iframe at all off localhost — GitHub Pages publishes this file next to the
     app, so "somewhere else" is a page anyone can open. */
  body { background: var(--bg); color: var(--text-primary); margin: 0;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--text-muted); font-size: 12.5px; margin: 0 0 18px; }
  #summary { font-weight: 600; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px;
             border: 1px solid var(--border); background: var(--surface); }
  #summary.ok  { color: var(--ok);  border-color: var(--ok); }
  #summary.bad { color: var(--err); border-color: var(--err); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  td.st { width: 28px; font-weight: 700; }
  tr.pass td.st { color: var(--ok); }
  tr.fail td.st { color: var(--err); }
  tr.fail td.msg { color: var(--err); }
  .msg { color: var(--text-muted); font-size: 12px; white-space: pre-wrap; }
  .group td { padding-top: 16px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
              text-transform: uppercase; color: var(--text-muted); border-bottom-color: var(--border-strong); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sprint Velocity — Pure-Function Tests</h1>
  <p class="sub">Runs against the real <code>index.html</code> in a hidden iframe. Read-only:
    nothing is saved — and it only runs on <code>localhost</code>, where that iframe can't be
    your signed-in copy of the app.</p>
  <div id="summary">Loading app…</div>
  <table><tbody id="out"></tbody></table>
</div>
<!-- The iframe is built in script, not here: it boots the real app, so it must
     not exist until the localhost gate at the foot of this file has passed. -->

<script>
'use strict';
const TESTS = [];
let currentGroup = '';
function group(name) { TESTS.push({ group: name }); }
function t(name, fn) { TESTS.push({ name, fn }); }

function fmt(v) { return typeof v === 'string' ? JSON.stringify(v) : JSON.stringify(v); }
function eq(actual, expected, note) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error((note ? note + ': ' : '') + 'expected ' + e + ', got ' + a);
}
function approx(actual, expected, note, eps) {
  if (typeof actual !== 'number' || Math.abs(actual - expected) > (eps || 1e-9))
    throw new Error((note ? note + ': ' : '') + 'expected ≈' + expected + ', got ' + fmt(actual));
}
function ok(cond, note) { if (!cond) throw new Error(note || 'expected truthy'); }

/* nextSprintTarget() and rollingSprints() read the app's live `state` rather than
   taking it as an argument, so these tests swap the collections in, run, and put
   the originals back — always in a finally, or one failure would leave the fixture
   in place and every later test would be measuring it. Nothing here calls save():
   the suite is read-only, which is the promise printed at the top of the page. */
function withState(data, fn) {
  const st = w.svGet();
  const keys = ['teams', 'arts', 'pis', 'sprints', 'plans'];
  const before = {};
  keys.forEach(k => { before[k] = st[k]; });
  const inProg = st.settings.includeInProgress;
  keys.forEach(k => { st[k] = data[k] || []; });
  st.settings.includeInProgress = !!data.includeInProgress;
  try { return fn(); }
  finally {
    keys.forEach(k => { st[k] = before[k]; });
    st.settings.includeInProgress = inProg;
  }
}

/* One team, one PI, four finished sprints. No dates on purpose — sprintStatus()
   treats a dateless sprint as complete, which is what keeps pre-lifecycle history
   in the averages, and it keeps these fixtures to the figures under test. Four
   rather than five so the slot being planned is S5, not the IP sprint, whose own
   caveat would otherwise ride along on every assertion here. */
function capacityFixture(extra) {
  const done = [10, 20, 30, 40];
  return Object.assign({
    teams: [{ id: 't1', name: 'Team One' }],
    arts: [],
    pis: [{ id: 'p1', name: 'PI 1' }],
    sprints: done.map((v, i) => ({
      id: 's' + (i + 1), teamId: 't1', piId: 'p1', sprintNumber: i + 1,
      committed: v, committedCompleted: v, totalCompleted: v,
      added: 0, removed: 0, carriedIn: 0, carriedOut: 0, addedThenRemoved: 0
    })),
    plans: []
  }, extra || {});
}

/* Sprints described by exactly what the headroom signal reads: what was committed,
   how much of the commitment landed, and how much extra work came in on top of it
   and finished. Dateless like capacityFixture, and for the same reason. */
function headroomFixture(rows) {
  return {
    teams: [{ id: 't1', name: 'Team One' }],
    arts: [],
    pis: [{ id: 'p1', name: 'PI 1' }],
    sprints: rows.map((r, i) => ({
      id: 's' + (i + 1), teamId: 't1', piId: 'p1', sprintNumber: i + 1,
      committed: r.committed, committedCompleted: r.done,
      totalCompleted: r.done + (r.extra || 0), added: r.extra || 0,
      removed: 0, carriedIn: 0, carriedOut: 0, addedThenRemoved: 0
    })),
    plans: []
  };
}

/* ── Fixtures ─────────────────────────────────────────────────────────────── */

/* An ordinary tab-separated Sprint Report paste: three sections, one starred
   (added mid-sprint) completed issue, and one issue that was added then removed
   (starred AND in the removed section — must net out of both). Header totals
   are Jira's own checksums and match the rows. */
const TABBED = [
  'Completed Issues',
  'Key\tSummary\tIssue Type\tPriority\tStatus\tStory Points (13)',
  'ABC-1\tBuild the thing\tStory\tHigh\tDone\t5',
  'ABC-2\tFix the thing\tBug\tMedium\tDone\t3',
  'ABC-3 *\tBroke in and finished\tStory\tHigh\tDone\t5',
  'Issues Not Completed',
  'Key\tSummary\tIssue Type\tPriority\tStatus\tStory Points (8)',
  'ABC-4\tHalf done\tStory\tLow\tIn Progress\t8',
  'Issues Removed From Sprint',
  'Key\tSummary\tIssue Type\tPriority\tStatus\tStory Points (7)',
  'ABC-5\tDescoped\tStory\tLow\tOpen\t2',
  'ABC-6 *\tIn then out\tStory\tLow\tOpen\t5',
].join('\n');

/* Mid-sprint re-estimates: rows carry "start → current" and the header carries
   the same range. Committed must use the start sizes; everything else current. */
const RESIZED = [
  'Completed Issues',
  'Key\tSummary\tStatus\tStory Points (21 → 15)',
  'XYZ-1\tBig story, shrank\tDone\t13 → 8',
  'XYZ-2\tSteady-ish\tDone\t8 → 7',
  'Issues Not Completed',
  'Key\tSummary\tStatus\tStory Points (5)',
  'XYZ-3\tRolls over\tIn Progress\t5',
].join('\n');

/* Some browsers flatten a copied table to one cell per line. Every issue key on
   its own line — the flattened branch must win on the count of such lines. */
const FLATTENED = [
  'Completed Issues',
  'Story Points (8)',
  'ABC-1',
  'First thing',
  'Story',
  '5',
  'ABC-2',
  'Second thing',
  'Story',
  '3',
].join('\n');

/* The documented regression: one stray bare key (a linked epic copying onto its
   own line) must NOT flip a tabbed report into the flattened branch. */
const TABBED_WITH_STRAY = [
  'Completed Issues',
  'Key\tSummary\tStatus\tStory Points (8)',
  'ABC-1\tFirst thing\tDone\t5',
  'EPIC-99',
  'ABC-2\tSecond thing\tDone\t3',
].join('\n');

/* A trailing "-" cell after the estimate column must not zero the row; a row
   whose only figure is "-" is genuinely unestimated and reads 0. */
const TRAILING_DASH = [
  'Completed Issues',
  'Key\tSummary\tStatus\tStory Points (3)',
  'ABC-7\tEstimated, decorative dash after\tDone\t3\t-',
  'ABC-8\tGenuinely unestimated\tDone\t-',
].join('\n');

/* ── Tests ────────────────────────────────────────────────────────────────── */
let w; // the app iframe's window

group('sanitizeIds — the untrusted-id boundary');
t('hostile ids are replaced and every reference rewritten through the same map', () => {
  const evil = 'x"><img src=q onerror=alert(1)>';
  const data = {
    teams: [{ id: evil, name: 'T' }],
    pis: [{ id: 'ok-pi', name: 'PI' }],
    sprints: [{ id: 's1', teamId: evil, piId: 'ok-pi', sprintNumber: 1 }],
    settings: { activeTeamId: evil, activePiId: 'ok-pi' },
  };
  const out = w.sanitizeIds(data);
  const fresh = out.teams[0].id;
  ok(/^[A-Za-z0-9_-]{1,64}$/.test(fresh), 'replacement id is a plain id');
  ok(fresh !== evil, 'hostile id was replaced');
  eq(out.sprints[0].teamId, fresh, 'sprint.teamId follows the team');
  eq(out.settings.activeTeamId, fresh, 'settings.activeTeamId follows the team');
  eq(out.pis[0].id, 'ok-pi', 'valid ids pass through untouched');
  eq(out.sprints.length, 1, 'a remapped sprint is not mistaken for an orphan');
  eq(w.sanitizeIds.dropped, 0, 'nothing dropped');
});
t('a sprint whose team or PI is missing from the payload is dropped, and counted', () => {
  const data = {
    teams: [{ id: 'team-1', name: 'A' }],
    pis: [{ id: 'pi-1', name: 'PI 1' }],
    sprints: [
      { id: 's1', teamId: 'team-1', piId: 'pi-1', sprintNumber: 1 },
      { id: 's2', teamId: 'team-1', piId: 'pGONE', sprintNumber: 2 },
      { id: 's3', teamId: 'tGONE', piId: 'pi-1', sprintNumber: 3 },
    ],
    settings: {},
  };
  const out = w.sanitizeIds(data);
  eq(out.sprints.length, 1, 'only the sprint whose team and PI are both present survives');
  eq(out.sprints[0].id, 's1');
  eq(w.sanitizeIds.dropped, 2, 'the count is handed to the caller so the drop is never silent');
});
t('the drop count resets, so a caller never reads a stale one', () => {
  w.sanitizeIds({ teams: [], pis: [], sprints: [{ id: 's1', teamId: 'gone', piId: 'gone' }] });
  eq(w.sanitizeIds.dropped, 1);
  w.sanitizeIds({ teams: [{ id: 't1' }], pis: [{ id: 'p1' }], sprints: [] });
  eq(w.sanitizeIds.dropped, 0, 'a clean payload reports zero');
  w.sanitizeIds(null);
  eq(w.sanitizeIds.dropped, 0, 'so does junk that never reaches the check');
});
t('valid data passes through byte-identical', () => {
  const data = { teams: [{ id: 'team-1', name: 'A' }], pis: [], sprints: [], settings: {} };
  const out = w.sanitizeIds(JSON.parse(JSON.stringify(data)));
  eq(out.teams[0].id, 'team-1');
});
t('non-object input is returned as-is, not exploded', () => {
  eq(w.sanitizeIds(null), null);
  eq(w.sanitizeIds('junk'), 'junk');
});
/* The regression that took cloud sync down when ARTs shipped. `x.id = clean(x.id)`
   on an absent key creates it holding `undefined`; JSON.stringify drops that, so
   localStorage and every export looked perfect, while setDoc() walked the live
   object and Firestore refused the whole document with invalid-argument. Checked by
   key, not by value — `out.settings.artFilter === undefined` passes either way. */
const undefKeys = (o) => Object.keys(o).filter(k => o[k] === undefined);
t('a setting that is absent stays absent, never created holding undefined', () => {
  const out = w.sanitizeIds({ teams: [], arts: [], pis: [], sprints: [],
                              settings: { view: 'sprint' } });
  eq(undefKeys(out.settings), [], 'invisible in JSON, fatal to the cloud push');
  ok(!('artFilter' in out.settings), 'a copy saved before ARTs existed gains no artFilter key');
});
t('the same holds for every id the boundary touches', () => {
  const out = w.sanitizeIds({ teams: [{ name: 'no id' }], arts: [{ name: 'no id' }],
                              pis: [{ name: 'no id' }], sprints: [], settings: {} });
  eq(undefKeys(out.teams[0]), []);
  eq(undefKeys(out.arts[0]), []);
  eq(undefKeys(out.pis[0]), []);
  eq(undefKeys(out.settings), []);
});
t('a whole saved copy survives the round trip with no undefined anywhere in it', () => {
  /* What the cloud push actually hands Firestore — every nested object, not just
     the top level, since one undefined at any depth rejects the document. */
  const deepUndef = (v, path) => (v && typeof v === 'object')
    ? Object.keys(v).flatMap(k => v[k] === undefined ? [path + '.' + k] : deepUndef(v[k], path + '.' + k))
    : [];
  const out = w.sanitizeIds(w.coerceShape({
    teams: [{ id: 't1', name: 'A' }],
    pis: [{ id: 'p1', name: 'PI 1' }],
    sprints: [{ id: 's1', teamId: 't1', piId: 'p1', sprintNumber: 1 }],
    settings: { activeTeamId: 't1', view: 'sprint' },
  }));
  eq(deepUndef(out, 'state'), []);
});

/* Only numbers and dates are ever saved. The old free-text notes feature was
   removed on purpose — the figures come from a work Jira and the saved/synced
   copy must stay clean — so notes arriving in an old localStorage copy, cloud
   document, backup or share link are deleted at this boundary and counted. */
t('legacy free-text notes are scrubbed at the boundary, and counted', () => {
  const out = w.sanitizeIds({
    teams: [{ id: 't1', name: 'A' }], arts: [], pis: [{ id: 'p1', name: 'PI 1' }],
    sprints: [
      { id: 's1', teamId: 't1', piId: 'p1', sprintNumber: 1,
        notes: { added: 'sensitive detail', removed: '', carriedOut: '', general: '' } },
      { id: 's2', teamId: 't1', piId: 'p1', sprintNumber: 2 },
    ],
    settings: {},
  });
  ok(!('notes' in out.sprints[0]), 'the notes key is deleted, not emptied');
  eq(undefKeys(out.sprints[0]), [], 'and never left holding undefined — that stops the cloud push');
  eq(w.sanitizeIds.strippedNotes, 1, 'the count is handed to the caller so boot can persist the scrub');
  w.sanitizeIds({ teams: [], arts: [], pis: [], sprints: [], settings: {} });
  eq(w.sanitizeIds.strippedNotes, 0, 'and it resets, so a caller never reads a stale one');
});

/* The whitelist half of the same boundary: only numbers, dates and short labels
   are ever saved, so a stray key from a hand-edited backup, cloud document or
   share link is dropped, and a known key holding the wrong kind of value is
   pinned back to its type rather than stored as-is. */
t('stray keys are dropped and wrong-typed values pinned at the boundary', () => {
  const out = w.sanitizeIds(w.coerceShape({
    junkTop: 'DAE-1023 a work item summary',
    teams: [{ id: 't1', name: 'A', smuggled: 'ticket text', artId: null }],
    arts: [], pis: [{ id: 'p1', name: 'PI 1' }],
    sprints: [{ id: 's1', teamId: 't1', piId: 'p1', sprintNumber: 1,
      committed: '12', startDate: 'call John about the incident',
      status: 'weird', freeText: 'DAE-99 another summary' }],
    settings: { activeTeamId: 't1', rogue: 'text nobody asked for' },
  }));
  ok(!('junkTop' in out), 'a stray top-level key is dropped');
  ok(!('smuggled' in out.teams[0]), 'a stray team key is dropped');
  ok(!('freeText' in out.sprints[0]), 'a stray sprint key is dropped');
  ok(!('rogue' in out.settings), 'a stray settings key is dropped');
  eq(out.teams[0].artId, null, 'a legitimately-null artId survives');
  eq(out.sprints[0].committed, 12, 'a figure arriving as a string is stored as a number');
  eq(out.sprints[0].startDate, '', 'a date that is not a date is emptied, never stored as text');
  eq(out.sprints[0].status, 'auto', 'an unknown status falls back to auto');
  ok(w.sanitizeIds.pruned > 0, 'the scrub is counted so boot can persist it');
  eq(undefKeys(out.sprints[0]), [], 'and nothing is left holding undefined');
});
t('a clean copy prunes nothing, so boot never saves for no reason', () => {
  w.sanitizeIds(w.coerceShape({
    version: 1,
    teams: [{ id: 't1', name: 'A', artId: null }],
    arts: [], pis: [{ id: 'p1', name: 'PI 1', sprintCount: 6 }],
    sprints: [{ id: 's1', teamId: 't1', piId: 'p1', sprintNumber: 1,
      startDate: '2026-06-01', endDate: '2026-06-12', status: 'auto',
      committed: 30, committedCompleted: 28, totalCompleted: 31, added: 3,
      removed: 0, carriedIn: 2, carriedOut: 2, addedThenRemoved: 0 }],
    settings: { activeTeamId: 't1', activePiId: 'p1', activeSprintNum: 1,
      artFilter: null, includeSprint6InRolling: false,
      includeInProgress: false, view: 'sprint' },
  }));
  eq(w.sanitizeIds.pruned, 0, 'every key the app itself writes passes untouched');
});
t('share-meta keys cross the boundary intact, for the shared-view banner', () => {
  const out = w.sanitizeIds(w.coerceShape({
    v: 1, sharedAt: 1755000000000, label: 'Team A', allTeams: false,
    range: { kind: 'pi', n: 1 },
    teams: [{ id: 't1', name: 'A' }], arts: [], pis: [], sprints: [], settings: {},
  }));
  eq(out.sharedAt, 1755000000000, 'sharedAt survives');
  eq(out.label, 'Team A', 'the label survives');
  eq(out.range.n, 1, 'the range survives — the banner is built from its two numbers');
});

t('a team pointing at a missing ART is un-grouped, never dropped', () => {
  const data = {
    teams: [{ id: 'team-1', name: 'A', artId: 'aGONE' }, { id: 'team-2', name: 'B', artId: 'art-1' }],
    arts: [{ id: 'art-1', name: 'Payments' }],
    pis: [{ id: 'pi-1' }], sprints: [],
    settings: { artFilter: 'aGONE' },
  };
  const out = w.sanitizeIds(data);
  eq(out.teams.length, 2, 'a broken label never costs a team its data');
  eq(out.teams[0].artId, null, 'the dangling ART is cleared, so the team reads as "No ART"');
  eq(out.teams[1].artId, 'art-1', 'a real ART is left alone');
  eq(out.settings.artFilter, null, 'a filter naming an ART that is gone falls back to all');
});
t('a hostile ART id is replaced and the teams on it follow', () => {
  const evil = 'x"><img src=q onerror=alert(1)>';
  const out = w.sanitizeIds({
    teams: [{ id: 't1', name: 'A', artId: evil }],
    arts: [{ id: evil, name: 'ART' }],
    pis: [], sprints: [], settings: { artFilter: evil },
  });
  const fresh = out.arts[0].id;
  ok(/^[A-Za-z0-9_-]{1,64}$/.test(fresh), 'replacement id is a plain id');
  eq(out.teams[0].artId, fresh, 'the team follows its ART through the remap');
  eq(out.settings.artFilter, fresh, 'so does the saved filter');
});
t('the "no ART" filter sentinel survives the boundary intact', () => {
  const NONE = w.__svTestHooks.ART_NONE;
  ok(!/^[A-Za-z0-9_-]{1,64}$/.test(NONE), 'the sentinel is not a legal id, so nothing can collide with it');
  const out = w.sanitizeIds({ teams: [], arts: [], pis: [], sprints: [],
                              settings: { artFilter: NONE } });
  eq(out.settings.artFilter, NONE, 'it is not swapped for a fresh id, nor cleared as an orphan');
});

group('teamsInArt + groupTeamsByArt — the ART grouping');
const ARTS = [{ id: 'a1', name: 'Payments' }, { id: 'a2', name: 'Platform' }];
const TEAMS = [
  { id: 't1', name: 'Kestrel', artId: 'a2' },
  { id: 't2', name: 'Otter' },
  { id: 't3', name: 'Puffin', artId: 'a1' },
  { id: 't4', name: 'Heron', artId: 'a2' },
];
const names = (list) => list.map(t => t.name);

t('no filter means every team, and never the caller\'s own array', () => {
  eq(names(w.teamsInArt(TEAMS, null)), ['Kestrel', 'Otter', 'Puffin', 'Heron']);
  eq(names(w.teamsInArt(TEAMS, '')), ['Kestrel', 'Otter', 'Puffin', 'Heron']);
  ok(w.teamsInArt(TEAMS, null) !== TEAMS, 'a copy, so a caller sorting the result cannot reorder state');
});
t('an ART filter keeps only its own teams', () => {
  eq(names(w.teamsInArt(TEAMS, 'a2')), ['Kestrel', 'Heron']);
  eq(names(w.teamsInArt(TEAMS, 'a1')), ['Puffin']);
  eq(w.teamsInArt(TEAMS, 'gone'), [], 'an ART with nothing on it filters to nothing, not to everything');
});
t('the sentinel picks out the teams on no ART at all', () => {
  eq(names(w.teamsInArt(TEAMS, w.__svTestHooks.ART_NONE)), ['Otter']);
});
t('junk input never throws', () => {
  eq(w.teamsInArt(null, 'a1'), []);
  eq(w.teamsInArt(undefined, null), []);
});
t('grouping puts each ART\'s teams together, in ART order, un-grouped last', () => {
  eq(names(w.groupTeamsByArt(TEAMS, ARTS)), ['Puffin', 'Kestrel', 'Heron', 'Otter']);
});
t('within a group the teams keep the order they were added in', () => {
  const swapped = w.groupTeamsByArt(
    [{ id: 'x', name: 'Later', artId: 'a2' }, { id: 'y', name: 'Earlier', artId: 'a2' }], ARTS);
  eq(names(swapped), ['Later', 'Earlier'], 'grouping is a stable sort, not a re-ordering');
});
t('with no ARTs at all the list comes back untouched', () => {
  eq(names(w.groupTeamsByArt(TEAMS, [])), ['Kestrel', 'Otter', 'Puffin', 'Heron']);
  eq(names(w.groupTeamsByArt(TEAMS, null)), ['Kestrel', 'Otter', 'Puffin', 'Heron']);
});

group('coerceShape — the shape guard in front of the same boundary');
t('a list that is not a list becomes an empty one instead of crashing every render', () => {
  const out = w.coerceShape({ teams: 'junk', arts: 42, pis: 42, sprints: null });
  eq(out.teams, []);
  eq(out.arts, []);
  eq(out.pis, []);
  eq(out.sprints, []);
});
t('an export written before ARTs existed gains an empty list, not undefined', () => {
  eq(w.coerceShape({ teams: [], pis: [], sprints: [] }).arts, []);
});
t('the same for capacity adjustments — an older export gains an empty plans list', () => {
  eq(w.coerceShape({ teams: [], arts: [], pis: [], sprints: [] }).plans, []);
  eq(w.coerceShape({ plans: 'junk' }).plans, []);

group('trimShareSprints — how much history a share link carries');
/* Two teams on the same three PIs, deliberately out of order in the array and with
   the busier team ahead of the other, so per-team windowing and program ordering
   are both actually being tested rather than falling out of the input order. */
const PIS = [{ id: 'p1' }, { id: 'p2' }, { id: 'p3' }];
const SS = [
  { id: 'b2', teamId: 'B', piId: 'p2', sprintNumber: 1 },
  { id: 'a3', teamId: 'A', piId: 'p1', sprintNumber: 3 },
  { id: 'a5', teamId: 'A', piId: 'p3', sprintNumber: 1 },
  { id: 'a1', teamId: 'A', piId: 'p1', sprintNumber: 1 },
  { id: 'a4', teamId: 'A', piId: 'p2', sprintNumber: 1 },
  { id: 'a2', teamId: 'A', piId: 'p1', sprintNumber: 2 },
  { id: 'b1', teamId: 'B', piId: 'p1', sprintNumber: 6 },
];
const ids = (out) => out.map(s => s.id).sort();

t('all history is handed straight back — the same array, not a filtered copy', () => {
  ok(w.trimShareSprints(SS, PIS, { kind: 'all' }) === SS, 'an explicit "all"');
  ok(w.trimShareSprints(SS, PIS, null) === SS, 'a missing scope means all');
});
t('a sprint window is per team, so the busier team cannot eat the whole window', () => {
  const out = w.trimShareSprints(SS, PIS, { kind: 'sprint', n: 2 });
  eq(ids(out), ['a4', 'a5', 'b1', 'b2'], 'each team keeps its own last 2');
});
t('program order beats array order — the newest are by PI then sprint number', () => {
  eq(ids(w.trimShareSprints(SS, PIS, { kind: 'sprint', n: 1 })), ['a5', 'b2']);
  eq(ids(w.trimShareSprints(SS, PIS, { kind: 'sprint', n: 3 })),
     ['a3', 'a4', 'a5', 'b1', 'b2'], 'A reaches back into p1, B has only 2 to give');
});
t('the payload keeps its stored order, so two links stay diffable', () => {
  eq(w.trimShareSprints(SS, PIS, { kind: 'sprint', n: 2 }).map(s => s.id),
     ['b2', 'a5', 'a4', 'b1']);
});
t('a PI window is global and never splits a PI', () => {
  eq(ids(w.trimShareSprints(SS, PIS, { kind: 'pi', n: 1 })), ['a5'],
     'only the newest PI any sprint reaches, for every team alike');
  eq(ids(w.trimShareSprints(SS, PIS, { kind: 'pi', n: 2 })), ['a4', 'a5', 'b2']);
});
t('a window bigger than the history is a no-op, and an empty list never throws', () => {
  eq(ids(w.trimShareSprints(SS, PIS, { kind: 'sprint', n: 99 })), ids(SS));
  eq(ids(w.trimShareSprints(SS, PIS, { kind: 'pi', n: 99 })), ids(SS));
  eq(w.trimShareSprints([], PIS, { kind: 'sprint', n: 2 }), []);
});

group('encodeShare / decodeShare — the share-link round trip');
/* The same shape buildSharePayload() emits: nothing but ids, numbers, dates and
   the short labels — a share link must never need more. */
const SHARE_PAYLOAD = {
  v: 1, sharedAt: 1755000000000, label: 'Kestrel',
  teams: [{ id: 't1', name: 'Kestrel', artId: null }],
  arts: [], pis: [{ id: 'p1', name: 'PI 1', sprintCount: 6 }],
  sprints: [{ id: 's1', teamId: 't1', piId: 'p1', sprintNumber: 1,
    startDate: '2026-06-01', endDate: '2026-06-12', status: 'auto',
    committed: 30, committedCompleted: 28, totalCompleted: 31, added: 3,
    removed: 0, carriedIn: 2, carriedOut: 2, addedThenRemoved: 0 }],
  plans: [{ id: 'pl1', teamId: 't1', piId: 'p1', sprintNumber: 2,
    availability: 60, reason: 'leave' }],
  settings: { activeTeamId: 't1', activePiId: null, artFilter: null,
    includeSprint6InRolling: false, includeInProgress: false, view: 'sprint' },
};
t('a payload round-trips through encode and decode intact', async () => {
  const token = await w.encodeShare(SHARE_PAYLOAD);
  ok(/^[01]\./.test(token), 'the token leads with its format marker, 1 or 0');
  const out = await w.decodeShare(token);
  eq(out.teams[0].name, 'Kestrel');
  eq(out.sprints.length, 1);
  eq(out.sprints[0].committed, 30, 'the figures survive the trip untouched');
  eq(out.sharedAt, 1755000000000, 'so does the banner metadata');
});
t('the plain-JSON 0. marker (no CompressionStream) decodes the same', async () => {
  const raw = new TextEncoder().encode(JSON.stringify(SHARE_PAYLOAD));
  const out = await w.decodeShare('0.' + w.__svTestHooks.b64urlEncode(raw));
  eq(out.teams.length, 1);
  eq(out.sprints[0].totalCompleted, 31);
});
t('a teamless payload is refused outright, never opened as an empty view', async () => {
  const token = await w.encodeShare(Object.assign({}, SHARE_PAYLOAD, { teams: [] }));
  let threw = false;
  try { await w.decodeShare(token); } catch (e) { threw = true; }
  ok(threw, 'decodeShare throws — the recipient gets the error card, not a blank app');
});
t('a token with no format marker is refused, not guessed at', async () => {
  let threw = false;
  try { await w.decodeShare('nodothere'); } catch (e) { threw = true; }
  ok(threw);
});
/* buildSharePayload() puts the capacity adjustments in the link precisely so the
   recipient's Target Capacity card shows the sender's figure — and the shared
   view once dropped them on arrival, showing the unadjusted number with no ⚑.
   The boundary half is pinned here; the openSharedView() assembly itself is
   boot-and-DOM-bound, so it can't be reached from this harness. */
t('the capacity adjustments survive the trip, for the recipient’s target card', async () => {
  const out = await w.decodeShare(await w.encodeShare(SHARE_PAYLOAD));
  eq(out.plans.length, 1, 'the plan is still in the decoded payload');
  eq(out.plans[0].availability, 60);
  eq(out.plans[0].reason, 'leave', 'still one of the fixed codes, never free text');
});

group('the sample data — the demo, and every feature reachable from it');
/* loadSample() confirms, saves, renders and toasts. The suite is read-only, so all
   four are stubbed for the length of the call and put back in a finally.

   These tests exist because the sample data is the app's DEMO — the thing a person
   sent a share link explores. Every finding below is ordinary-looking figures that
   a later edit could tidy, and tidying them would silently leave a first run with
   nothing to look at for that feature. A NEW FEATURE MEANS A NEW TEST HERE. */
function withSample(fn) {
  const real = { confirm: w.confirm, save: w.save, render: w.render, toast: w.toast };
  const st = w.svGet();
  const settings = { team: st.settings.activeTeamId, pi: st.settings.activePiId,
                     sprint: st.settings.activeSprintNum, view: st.settings.view };
  w.confirm = () => true; w.save = () => {}; w.render = () => {}; w.toast = () => {};
  try {
    return withState({ teams: [], arts: [], pis: [], sprints: [], plans: [] }, () => {
      w.loadSample();
      const by = (name) => st.teams.find(t => t.name === name);
      return fn(name => by(name).id, by);
    });
  } finally {
    Object.assign(w, real);
    st.settings.activeTeamId = settings.team;
    st.settings.activePiId = settings.pi;
    st.settings.activeSprintNum = settings.sprint;
    st.settings.view = settings.view;
  }
}

/* commitSprint() is NOT a pure function — it writes state and calls save(). The
   iframe shares this origin's localStorage with the real app, and the page header
   promises the suite saves nothing, so save() is stubbed out and the two settings
   commitSprint touches are put back. Everything else stays inside withState. */
function withCommitSprint(fx, fn) {
  const realSave = w.save;
  const st = w.svGet();
  const activePiId = st.settings.activePiId, activeSprintNum = st.settings.activeSprintNum;
  w.save = () => {};
  try { withState(fx, fn); }
  finally {
    w.save = realSave;
    st.settings.activePiId = activePiId;
    st.settings.activeSprintNum = activeSprintNum;
  }
}
t('commitSprint preserves the scale a form save cannot know about', () => {
  /* capacityScale is the one stored sprint field with NO input on the sprint form,
     because it belongs to capacity planning and is edited from Adjust Capacity.
     buildSprintRecord() rebuilds the whole record, so without this preservation a
     Save sprint or Jira re-paste would silently strip the scale. */
  const fx = capacityFixture();
  fx.sprints[0].capacityScale = 133;
  withCommitSprint(fx, () => {
    const edited = Object.assign({}, w.svGet().sprints.find(x => x.id === 's1'));
    delete edited.capacityScale;              // what buildSprintRecord() would hand over
    edited.committedCompleted = 12;
    ok(w.commitSprint(edited), 'the save itself succeeds');
    const after = w.svGet().sprints.find(x => x.id === 's1');
    eq(after.capacityScale, 133, 'the scale survives the edit');
    eq(after.committedCompleted, 12, 'and the edit itself lands');
  });
});
t('commitSprint never invents the key on a sprint that has no scale', () => {
  withCommitSprint(capacityFixture(), () => {
    const edited = Object.assign({}, w.svGet().sprints.find(x => x.id === 's1'));
    edited.committedCompleted = 12;
    w.commitSprint(edited);
    ok(!('capacityScale' in w.svGet().sprints.find(x => x.id === 's1')),
       'absent stays absent — a key holding undefined stops the Firestore push');
  });
});

group('rollingSprints — a sprint deliberately left out');
/* Seven counted sprints across two PIs, so the window has somewhere older to
   reach when one is dropped. Values ascend so which sprints are in the window
   is readable straight off the mean. */
function windowFixture() {
  const rows = [
    ['p1', 1, 10], ['p1', 2, 20], ['p1', 3, 30], ['p1', 4, 40], ['p1', 5, 50],
    ['p2', 1, 60], ['p2', 2, 70]

  return {
    teams: [{ id: 't1', name: 'Team One' }],
    arts: [],
    pis: [{ id: 'p1', name: 'PI 1' }, { id: 'p2', name: 'PI 2' }],
    sprints: rows.map(([pi, n, v], i) => ({
      id: 'w' + i, teamId: 't1', piId: pi, sprintNumber: n,
      committed: v, committedCompleted: v, totalCompleted: v,
      added: 0, removed: 0, carriedIn: 0, carriedOut: 0, addedThenRemoved: 0
    })),
    plans: []
  };
}

  /* By key, not by value: `x === undefined` passes either way, and it is the KEY
     existing that makes Firestore reject the whole document with invalid-argument. */
  ok(!('availability' in out.teams[0]), 'team availability');
  ok(!('availabilityReason' in out.teams[0]), 'team availability reason');
  ok(!('excluded' in out.sprints[0]), 'sprint exclusion');
  ok(!('excludeReason' in out.sprints[0]), 'sprint exclusion reason');
  eq(JSON.stringify(out).includes('undefined'), false);
});
t('a plan for a team or PI that is not in the payload is dropped, and counted', () => {
  const out = w.sanitizeIds(w.coerceShape({
    teams: [{ id: 't1', name: 'A' }], arts: [], pis: [{ id: 'p1', name: 'P' }], sprints: [],
    plans: [{ id: 'x1', teamId: 't1', piId: 'p1', sprintNumber: 1, availability: 80, reason: 'leave' },

  eq(w.sanitizeIds.dropped, 2, 'counted alongside orphaned sprints, so orphanNote() reports it');
});
t('two adjustments for one slot cannot both survive the boundary', () => {
  const out = w.sanitizeIds(w.coerceShape({

    plans: [{ id: 'x1', teamId: 't1', piId: 'p1', sprintNumber: 1, availability: 80, reason: 'leave' },

t('a hostile id on a plan is remapped with everything else that references it', () => {

/* ── Offline: the service worker ────────────────────────────────────────────
   These read sw.js as TEXT rather than exercising a live worker, and that is
   the point rather than a shortcut. The suite runs the app in a hidden iframe
   and the registration is frame-guarded, so there is no worker here to poke —
   deliberately, because a suite that installed one would start testing whatever
   code that worker had cached instead of the files on disk.

   What is worth asserting is therefore the SHAPE of the thing: that its cache
   list is only ever public files, and that it stays small and same-origin.
   Cache Storage is origin-wide, shared with Flow Metrics and financial-plan, so
   "nothing private is ever cached" is the single promise holding that up. */
group('Offline — the service worker');

/* Read once, here, because this is the first group that needs them and the
   runner walks the tests in declaration order. The newer-build group below
   pins index.html too and reuses APP_SRC rather than fetching it again. */
let SW_SRC = null, KILL_SRC = null, APP_SRC = null;
const stripComments = (s) => s.replace(/\/\*[\s\S]*?\*\//g, '').replace(/^\s*\/\/.*$/gm, '');

t('sw.js, its kill switch and the app all read back as text', async () => {
  const [a, b, c] = await Promise.all([fetch('sw.js'), fetch('sw-kill.js'), fetch('index.html')]);
  ok(a.ok, 'sw.js is missing');
  ok(b.ok, 'sw-kill.js is missing — the escape hatch has to exist BEFORE it is needed');
  ok(c.ok, 'index.html is missing');
  SW_SRC = await a.text(); KILL_SRC = await b.text(); APP_SRC = await c.text();
});

t('the cache list holds only files that are already public', () => {
  const m = SW_SRC.match(/const SHELL = \[([\s\S]*?)\]/);
  ok(m, 'could not find the SHELL list in sw.js');
  const shell = [...m[1].matchAll(/'([^']+)'/g)].map((x) => x[1]);
  /* Exact equality, not "contains". A new entry has to be added here too, which
     is the moment to ask whether the file is genuinely public. */
  eq(shell.slice().sort(), ['./', 'chart.min.js', 'favicon.ico', 'privacy.html', 'theme.css'],
    'the offline shell list changed');
});

t('nothing private can reach the cache', () => {
  const m = SW_SRC.match(/const SHELL = \[([\s\S]*?)\]/);
  const shell = [...m[1].matchAll(/'([^']+)'/g)].map((x) => x[1]);
  /* The specific things that must never be cached: the suite itself (which
     boots the app), the repo's own notes, and anything holding figures. */
  const banned = [/\.json$/, /^tests\.html$/, /\.py$/, /CLAUDE/i, /README/i, /NOTICE/i, /data/i];
  for (const entry of shell)
    for (const pat of banned)
      ok(!pat.test(entry), `"${entry}" is on the shell list but must never be cached`);
});

t('the worker touches nothing cross-origin', () => {
  const code = stripComments(SW_SRC);
  ok(!/https?:\/\//.test(code),
    'sw.js names an off-origin URL in executable code — it must only ever see this origin');
  /* No CSP applies to a worker on Pages, so these are not merely untidy here. */
  for (const bad of ['eval(', 'importScripts(', 'new Function('])
    ok(!code.includes(bad), `sw.js uses ${bad} — it runs with no CSP, so it must not`);
});

t('the worker deletes only its own caches', () => {
  const code = stripComments(SW_SRC);
  /* Cache Storage is origin-wide: an unguarded "delete every cache that is not
     mine" on activate would wipe Flow Metrics' or financial-plan's. */
  ok(/startsWith\(PREFIX\)/.test(code), "the activate handler must guard caches.delete with this app's prefix");
  ok(/const PREFIX = 'sv-shell-';/.test(SW_SRC), 'the prefix must be this app’s, not a sibling’s');
});

t('the worker is network-first, so cached code needs a failed network', () => {
  const code = stripComments(SW_SRC);
  ok(/Promise\.race/.test(code) && /cache\.match/.test(code),
    'expected the network-first race with a cache fallback');
  /* The tell for cache-first is answering from the cache before the network is
     tried at all. If that ever appears, the staleness argument has to be had
     again — see the reasoning at the top of sw.js. */
  ok(!/caches\.match\(req\)\s*\.then\(\s*\(?r\)?\s*=>\s*r\s*\|\|/.test(code),
    'this looks cache-first — the whole design rests on network-first');
  /* An answered-but-failed network is the third case: a transient 404/500 from
     Pages inside the race window must not beat a good cached shell. */
  ok(/!res\.ok && cached/.test(code),
    'a same-origin error reply with a cached copy in hand must serve the cache');
});

t('a missing shell file can be repaired without a new worker version', () => {
  const code = stripComments(SW_SRC);
  /* install fires ONCE per script version, so a cache evicted later would never
     be rebuilt if install were the only thing that filled it. */
  ok(/addEventListener\(\s*'message'/.test(code) && /'shell-check'/.test(code),
    'the worker must accept a shell-check message so the page can repair the cache');
  ok(/if \(reg\.active\) reg\.active\.postMessage\(\{ type: 'shell-check' \}\)/.test(APP_SRC),
    'the page must ask for a shell check on load');
  /* addAll is all-or-nothing: one 404 and there is no offline at all, silently. */
  ok(!/addAll/.test(code),
    'addAll rejects the whole precache on a single 404 — fetch entries one by one');
  ok(/e\.waitUntil\(topUp\(\)/.test(code), 'install must fill the cache via topUp');
});

t('the message handler accepts only its own signal', () => {
  const code = stripComments(SW_SRC);
  /* The worker has no CSP and postMessage is reachable from any page on the
     shared origin, so the handler must ignore everything but the one type and
     must never take a URL or a cache name out of the message. */
  ok(/e\.data\.type !== 'shell-check'\) return;/.test(code),
    'the message handler must reject anything but shell-check');
  ok(!/e\.data\.(url|urls|path|cache|key)/.test(code),
    'the worker must never read a URL or cache name out of a message');
});

t('the shell key strips the query string, which the favicon needs', () => {
  /* The markup asks for favicon.ico?v=1 in two places. Without the strip the
     precached favicon.ico would never be the entry that answers it. */
  ok(/favicon\.ico\?v=1/.test(APP_SRC), 'the cache-buster has gone — recheck this test');
  ok(/let p = url\.pathname;/.test(SW_SRC) && /SHELL_PATHS\.has\(p\)/.test(SW_SRC),
    'shellKey must match on the path alone, never on the full URL');
});

t('the kill switch stays a pure uninstaller', () => {
  const code = stripComments(KILL_SRC);
  ok(/unregister\(\)/.test(code), 'sw-kill.js must unregister itself');
  ok(!/addEventListener\(\s*'fetch'/.test(code),
    'sw-kill.js must not intercept requests — inert is the entire point');
  ok(!/cache\.put|addAll/.test(code), 'sw-kill.js must never cache anything');
  ok(/startsWith\('sv-shell-'\)/.test(code),
    "sw-kill.js must clear only this app's caches, never a sibling's");
});

t('the page declares worker-src and registration is guarded three ways', () => {
  const csp = APP_SRC.match(/http-equiv="Content-Security-Policy" content="([^"]+)"/);
  ok(csp, 'no CSP meta tag found');
  ok(/worker-src 'self'/.test(csp[1]),
    "CSP must spell out worker-src 'self' rather than lean on the fallback chain");
  ok(!/worker-src[^;]*https?:/.test(csp[1]), 'worker-src must not admit any off-origin host');
  ok(/window\.top !== window\.self/.test(APP_SRC),
    'the registration must skip frames, or this suite would install a worker on itself');
  ok(/if \(window\.svViewOnly\) return;/.test(APP_SRC),
    "a shared view — or a page halted on newer data — must not install a worker");
  ok(/window\.addEventListener\('load', function \(\) \{/.test(APP_SRC),
    'registration must wait for load rather than compete with first paint');
});

t('the halt clears this app’s caches before reloading, and only this app’s', () => {
  /* A plain reload can be answered by the worker out of the same stale cache
     that caused the halt, so the Reload button takes the worker out first. */
  ok(/reg\.unregister\(\)/.test(APP_SRC), 'the halt’s Reload must unregister the worker first');
  ok(/k\.startsWith\('sv-shell-'\)/.test(APP_SRC),
    'and clear only this app’s caches — the origin is shared');
});

/* ── A copy from a newer build ──────────────────────────────────────────────
   The braces to the service worker's belt. Cached code can be a build behind,
   and sync — or a restore, or a link — can hand that build data a newer one
   wrote. sanitizeIds() would strip the fields it has never heard of and the
   next edit would push the stripped copy back, so the app refuses instead.

   The halt itself is pinned as SOURCE rather than run: it draws a card over the
   whole frame and THROWS, which would take the rest of the suite down with it.
   What is asserted is that the guard exists, that it sits before the code that
   would strip or swallow it, and that it reuses the one write chokepoint. */
group('A copy from a newer build');

t('a blank state is stamped with the format this build understands', () => {
  eq(w.blankState().version, w.__svTestHooks.SCHEMA);
});

t('the halt fires above the current version and not at or below it', () => {
  /* The comparison the guard makes, asserted directly — an off-by-one here
     would either halt on every ordinary load or never halt at all. */
  const S = w.__svTestHooks.SCHEMA;
  const halts = (v) => Number(v || 1) > S;
  ok(!halts(S), 'must not halt on data this build wrote');
  ok(!halts(S - 1), 'must not halt on older data — the boundary already handles that');
  ok(!halts(undefined), 'data with no version at all is old, not new');
  ok(halts(S + 1), 'must halt on data from a newer build');
});

t('the halt refuses to write and takes the sync module down with it', () => {
  /* It reuses viewOnly rather than inventing a second flag, so the promise is
     only as good as that flag still being the write chokepoint. */
  ok(/viewOnly = true;\n  window\.svViewOnly = true;/.test(APP_SRC),
    'haltForNewerData must set viewOnly and its window mirror, the existing no-write guards');
  ok(/if \(viewOnly\) return;/.test(APP_SRC), 'save\(\) must still be a no-op under viewOnly');
  ok(/!window\.svViewOnly && !inTestHarness/.test(APP_SRC),
    'the sync module must still refuse to start under svViewOnly');
});

t('load() checks before the try whose catch would hand back a blank state', () => {
  /* That catch returns blankState(), which is right for corrupt JSON and
     catastrophic here: a blank state the app then SAVES would overwrite the
     good copy with nothing. Anchored on the catch's own try rather than on the
     first `try {`, because the guard's one-line try for the peek precedes it. */
  const guardAt = APP_SRC.indexOf('haltForNewerData(peek.version)');
  const tryAt = APP_SRC.indexOf('try {\n    const raw = localStorage.getItem(STORAGE_KEY);');
  ok(guardAt > -1, 'load() must call haltForNewerData');
  ok(tryAt > -1, "load()'s main try block has moved — recheck this test");
  ok(guardAt < tryAt, 'the guard must run BEFORE the try whose catch returns a blank state');
  /* Read raw, or sanitizeIds strips the very fields that make it newer. */
  const coerceAt = APP_SRC.indexOf('sanitizeIds(coerceShape(JSON.parse(raw)))');
  ok(coerceAt > -1 && guardAt < coerceAt, 'the guard must run before coerceShape/sanitizeIds');
});

t('svAdopt stores the newer copy verbatim, then halts instead of adopting', () => {
  /* Not exercised live: the real svAdopt writes this browser's sv-data and the
     halt throws with its card over the frame. Pinned as source instead — the
     guard, the verbatim store, then the halt, all before sanitizeIds. */
  const at = APP_SRC.indexOf('window.svAdopt =');
  ok(at > -1, 'svAdopt has moved — recheck this test');
  const body = APP_SRC.slice(at, APP_SRC.indexOf('window.svCounts'));
  const guard = body.search(/\(\(incoming && incoming\.version\) \|\| 1\) > SCHEMA/);
  const store = body.indexOf('JSON.stringify(incoming)');
  const halt = body.indexOf('haltForNewerData(incoming.version)');
  const coerce = body.indexOf('sanitizeIds(coerceShape(incoming))');
  ok(guard > -1, 'svAdopt must refuse a version newer than this build');
  ok(store > guard && halt > store,
    'the newer copy must be stored VERBATIM before the halt — sanitizing would lose its fields');
  ok(coerce > -1 && halt < coerce, 'the halt must fire before sanitizeIds ever sees it');
});

t('the Restore path refuses a backup from a newer build, without halting', () => {
  /* The handler is FileReader UI all the way down, so pin the source. Nothing
     has arrived yet and what is on screen is still good, so this one refuses
     the file rather than stopping the app. */
  const at = APP_SRC.indexOf('JSON.parse(reader.result)');
  ok(at > -1, 'the restore handler has moved — recheck this test');
  const body = APP_SRC.slice(at, at + 2000);
  const guard = body.search(/Number\(rawParsed\.version \|\| 1\) > SCHEMA/);
  const coerce = body.indexOf('sanitizeIds(coerceShape(rawParsed))');
  ok(guard > -1, 'the restore handler must refuse a version newer than this build');
  ok(coerce > -1, 'the restore handler must still coerce the raw parse — has it moved?');
  ok(guard < coerce, 'the refusal must come before coerceShape sees the file');
  ok(!/haltForNewerData/.test(body), 'a refused file must not stop the app the user is using');
});

t('a share link from a newer build is refused, and says so', async () => {
  /* This one CAN run live: decodeShare touches no storage. */
  const future = Object.assign({}, SHARE_PAYLOAD, { v: 99 });
  const raw = new TextEncoder().encode(JSON.stringify(future));
  let err = null;
  try { await w.decodeShare('0.' + w.__svTestHooks.b64urlEncode(raw)); }
  catch (e) { err = e; }
  ok(err, 'decodeShare must refuse a payload version it does not know');
  ok(err.newerVersion, 'and mark it, so the error card can say the link is fine and the app is behind');
});

t('a share link of the current version still opens', async () => {
  const out = await w.decodeShare(await w.encodeShare(SHARE_PAYLOAD));
  eq(out.teams.length, 1, 'the guard must not catch ordinary links');
  eq(SHARE_PAYLOAD.v, w.__svTestHooks.SHARE_PAYLOAD_V,
    'the fixture and the app must agree on the current payload version');
});

group('esc — the free-text boundary (a team, ART or PI name reaching innerHTML)');
/* `sanitizeIds` above has had hostile-input tests since it was written; this
   boundary had none, here and in three siblings, which an audit found on
   2026-08-20. A crafted id was proved to be replaced, while `esc` — the function
   between a team or PI NAME and the markup of every picker, toolbar and table —
   was never called by the suite. Names are free text capped at 120 characters
   and deliberately not sanitized on the way in, because escaping at the sink is
   the design; so the sink is what has to be pinned. They also travel in share
   links, which is the one place the text is not something you typed yourself.
   It matters beyond this app: every GitHub Pages site in this account shares one
   browser origin, so a hole here is a hole in Flow Metrics too. */
t('every HTML-significant character is replaced', () => {
  eq(w.__svTestHooks.esc('<>&"\''), '&lt;&gt;&amp;&quot;&#39;');
});
t('a hostile team name survives as text and never as markup', () => {
  const evil = '"><img src=x onerror=alert(1)><script>alert(2)<\/script>';
  const e = w.__svTestHooks.esc(evil);
  /* Parsed for real rather than string-matched: the question is what a BROWSER
     builds from this, in an attribute as much as in text — `opt()` puts a name
     in a <option value="…"> and the manage table puts ids in data- attributes.
     A regex over the output would pass on markup the parser still accepts. */
  const probe = document.createElement('div');
  probe.innerHTML = '<span title="' + e + '">' + e + '</span>';
  eq(probe.querySelectorAll('img, script').length, 0, 'no element may be created');
  eq(probe.firstElementChild.textContent, evil, 'and the text reads back unchanged');
  eq(probe.firstElementChild.getAttribute('title'), evil, 'including inside an attribute');
});
t('null, undefined and numbers are handled, not thrown on', () => {
  eq(w.__svTestHooks.esc(null), '');
  eq(w.__svTestHooks.esc(undefined), '');
  eq(w.__svTestHooks.esc(7), '7');
});


group('Which fields raise a phone keyboard');
/* `openModal` moves focus off a text field onto the dialog on a touch screen, so
   the on-screen keyboard doesn't cover the dialog you just opened. What counts
   as "a text field" is the whole decision, and it is pure — pinned here so the
   list is a test rather than a rediscovery the next time a dialog opens on a
   field nobody thought about. Same block in Money Map and the sibling apps. */
t('a typing field does, whatever flavour', () => {
  for (const type of ['text', 'number', 'search', 'tel', 'url', 'email',
                      'password', 'date', 'month'])
    ok(w.__svTestHooks.raisesKeyboard({ tagName: 'INPUT', type }), `input[type=${type}]`);
  ok(w.__svTestHooks.raisesKeyboard({ tagName: 'TEXTAREA' }), 'a note box has no type at all');
});
t('a control you press or pick does not', () => {
  for (const type of ['checkbox', 'radio', 'button', 'submit', 'range', 'color', 'file'])
    eq(w.__svTestHooks.raisesKeyboard({ tagName: 'INPUT', type }), false, `input[type=${type}]`);
  eq(w.__svTestHooks.raisesKeyboard({ tagName: 'BUTTON' }), false);
  eq(w.__svTestHooks.raisesKeyboard({ tagName: 'SELECT' }), false);
  eq(w.__svTestHooks.raisesKeyboard({ tagName: 'SUMMARY' }), false, 'a disclosure — the sprint form opens on one');
  eq(w.__svTestHooks.raisesKeyboard({ tagName: 'DIALOG' }), false, 'the dialog itself, once focus lands there');
  eq(w.__svTestHooks.raisesKeyboard(null), false, 'nothing focused is not a keyboard');
});

/* ── Runner ───────────────────────────────────────────────────────────────── */

/* The localhost gate. Booting the app is itself the side effect worth guarding:
   on the published origin the iframe would be a real, signed-in copy, and
   onAuthStateChanged would start a Firestore session — or raise the "another
   device cleared its data" dialog — inside a frame nobody can see. So the check
   comes before the iframe exists, not inside its load handler.

   file:// has no hostname, so it fails this check on its own and lands on the
   file:// advice below. '' is deliberately NOT in this list — it used to be, and
   sent file:// down the iframe branch, where the frame silently never loads and
   the suite blamed the app (see CLAUDE.md). */
const LOCAL_HOSTS = ['localhost', '127.0.0.1', '[::1]'];

if (LOCAL_HOSTS.includes(location.hostname)) {
  const frame = document.createElement('iframe');
  frame.id = 'app';
  frame.title = 'app under test';
  /* index.html checks for this and leaves the sync module uninitialised. */
  frame.setAttribute('data-sv-tests', '');
  frame.setAttribute('aria-hidden', 'true');
  frame.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none';
  frame.addEventListener('load', () => setTimeout(run, 150), { once: true }); // let boot finish
  frame.src = 'index.html';           /* set before append: one load event, the real one */
  document.body.appendChild(frame);
} else {
  const s = document.getElementById('summary');
  s.className = 'bad';
  /* Two reasons to be here, needing different sentences: a published copy
     (where booting the app would touch real, signed-in data) and a file://
     copy off disk (where it simply cannot work — browsers block file://
     iframes). Both end at the same instruction. */
  const onDisk = location.protocol === 'file:';
  s.textContent = onDisk
    ? 'Not run from a file — this page needs a local server.'
    : 'Not run here — this page boots a live copy of the app.';
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = 3;
  td.style.cssText = 'font-size:13px;line-height:1.6';
  td.innerHTML = (onDisk
    ? 'The suite loads the app in a hidden frame to test it, and a browser blocks that '
      + 'frame when the page is opened straight off disk — so the tests would have nothing '
      + 'to run against. Serve the folder instead:'
    : 'The suite loads the app in a hidden frame to test it. On <strong></strong> '
      + 'that frame would be your real, signed-in copy, quietly starting a sync session where '
      + 'you can\'t see it. It runs on <code>localhost</code> only, against a copy served from '
      + 'the repo folder:') +
    '<br><br><code>cd ~/claude-sprint-velocity &amp;&amp; ' +
    'python3 -m http.server 8012</code><br>then open ' +
    '<code>http://localhost:8012/tests.html</code>.<br><br>' +
    'Nothing has been changed by opening this page — <a href="index.html">back to the app</a>.';
  if (!onDisk) td.querySelector('strong').textContent = location.hostname;
  tr.appendChild(td);
  document.getElementById('out').appendChild(tr);
  /* Only where the suite itself can't run. On localhost this row would land
     above the live results — and CI's scraper counts every tr.fail on the page,
     so a red PREVIOUS run rendered here could fail a suite that just passed. */
  showLatestRun();
}


/* ── The scorecard, where the suite itself can't run ─────────────────────────
   Refusing to run and then saying nothing about whether the tests pass is half
   an answer: the question someone opens this page to ask is "is it green?".
   The same suite runs headless in CI on every push, so ask GitHub how that went
   and show it here. Nothing is booted and nothing is stored — it is one public,
   unauthenticated read of a workflow's run list.
─────────────────────────────────────────────────────────────────────────── */
function showLatestRun() {
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = 3;
  td.style.cssText = 'font-size:14px;line-height:1.6;padding:12px 16px';
  td.textContent = 'Checking the latest CI run…';
  tr.appendChild(td);
  document.getElementById('out').appendChild(tr);

  fetch('https://api.github.com/repos/eagleadams86/sprint-velocity/actions/workflows/tests.yml/runs?branch=main&per_page=1')
    .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
    .then((d) => {
      const run = d && d.workflow_runs && d.workflow_runs[0];
      if (!run) { td.textContent = 'No CI runs found for this repository yet.'; return; }
      const done = run.status === 'completed';
      const okRun = run.conclusion === 'success';
      tr.className = !done ? '' : (okRun ? 'pass' : 'fail');
      const when = run.updated_at ? new Date(run.updated_at).toLocaleString() : '';
      const sha = String(run.head_sha || '').slice(0, 7);
      /* Only ever build an <a> when the API really did hand back a GitHub https
         URL — the same guard the app uses for any URL out of an API. */
      const url = String(run.html_url || '');
      td.textContent = (!done ? '⏳ The latest run is still going'
        : okRun ? '✓ The full suite passed in CI' : '✕ The suite FAILED in CI')
        + (when ? ' — ' + when : '') + (sha ? ' · commit ' + sha : '') + '. ';
      if (/^https:\/\/github\.com\//.test(url)) {
        const a = document.createElement('a');
        a.href = url; a.rel = 'noopener noreferrer';
        a.textContent = 'Open the run for the full scorecard';
        td.appendChild(a);
      }
    })
    .catch(() => { td.textContent = 'Could not reach GitHub to check the latest CI run.'; });
}

async function run() {
  w = document.getElementById('app').contentWindow;
  /* A frame that never got the app is a SETUP problem — the folder isn't being
     served, so index.html came back 404 — and without this every test throws
     "Cannot read properties of undefined" in turn, which reads like the app is
     catastrophically broken. Say the one thing that fixes it instead. */
  if (!w || !w.__svTestHooks) {
    const s = document.getElementById('summary');
    s.className = 'bad';
    s.textContent = 'The hidden frame never loaded index.html — is this folder being served?';
    document.getElementById('out').innerHTML =
      '<tr><td class="msg" style="white-space:normal;font-family:inherit;font-size:13px">' +
      'Run <code>cd ~/claude-sprint-velocity &amp;&amp; python3 -m http.server 8012</code> and open ' +
      '<code>http://localhost:8012/tests.html</code>.</td></tr>';
    return;
  }
  const out = document.getElementById('out');
  let pass = 0, fail = 0;
  for (const item of TESTS) {
    if (item.group) {
      const tr = document.createElement('tr');
      tr.className = 'group';
      tr.innerHTML = '<td colspan="3"></td>';
      tr.firstChild.textContent = item.group;
      out.appendChild(tr);
      continue;
    }
    const tr = document.createElement('tr');
    const st = document.createElement('td'); st.className = 'st';
    const name = document.createElement('td'); name.textContent = item.name;
    const msg = document.createElement('td'); msg.className = 'msg';
    try {
      /* Awaited, so a test may be async — the share round-trip group is, because
         encodeShare/decodeShare are. A sync test resolves immediately, and
         running one at a time keeps the rows in declaration order either way. */
      await item.fn();
      tr.className = 'pass'; st.textContent = '✓'; pass++;
    } catch (e) {
      tr.className = 'fail'; st.textContent = '✕'; msg.textContent = e.message; fail++;
    }
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
  }
  const s = document.getElementById('summary');
  s.textContent = fail === 0 ? `All ${pass} tests pass` : `${fail} of ${pass + fail} tests FAILED`;
  s.className = fail === 0 ? 'ok' : 'bad';
  document.title = (fail === 0 ? '✓ ' : '✕ ') + document.title;
}
</script>
