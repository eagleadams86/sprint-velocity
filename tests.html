/* ── The IP-sprint caveat is about a PI, so it cannot fire without one ──────
   rollingSprints() has always counted a PI-less sprint 6 as an ordinary delivery
   sprint (isIpSlot). nextSprintTarget() compared the bare number instead, so the
   capacity card told a team with no PIs to scale its target down "for whatever IP
   work is planned" — against a PI it hasn't got, and contradicting the Rolling 5
   tab two clicks away. The demo hides it because Team No PI starts at sprint 12. */
function sixthSlotFixture(piId) {
  const sp = (n) => ({ id: (piId || 'x') + n, teamId: 't1', piId, sprintNumber: n,
    committed: 20, committedCompleted: 20, totalCompleted: 20,
    added: 0, removed: 0, carriedIn: 0, carriedOut: 0, addedThenRemoved: 0 });
  return {
    teams: [{ id: 't1', name: 'A' }], arts: [], plans: [], objectives: [],
    pis: piId ? [{ id: piId, name: 'PI 1' }] : [],
    sprints: [sp(1), sp(2), sp(3), sp(4), sp(5)],
  };
}
t('the sixth slot outside a PI raises no IP-sprint caveat', () => {
  withState(sixthSlotFixture(null), () => {
    const t1 = w.nextSprintTarget('t1', false);
    eq(t1.slot.sprintNumber, 6, 'the next slot really is number six');
    eq(t1.slot.piId, null, 'on the unassigned track');
    eq(t1.isIpSprint, false, 'and six is only the IP sprint INSIDE a PI');
    const card = w.targetCapacityCard(w.svGet().teams[0], false);
    eq(/innovation/i.test(card), false, 'so the card must not tell them to scale down for IP work');
  });
});
t('and the sixth slot inside one still does', () => {
  withState(sixthSlotFixture('p1'), () => {
    const t1 = w.nextSprintTarget('t1', false);
    eq(t1.slot.sprintNumber, 6);
    eq(t1.isIpSprint, true);
    ok(/innovation/i.test(w.targetCapacityCard(w.svGet().teams[0], false)), 'and says so');
  });
});
t('an adjustment saved for a PI-less slot is still there after a reload', () => {
  /* The whole failure end to end, in the two calls a reload makes: the write path
     builds the plan from targetSprintSlot(), and load() puts it back through the
     boundary. It applied, then vanished. */
  const fx = sixthSlotFixture(null);
  /* The plan goes into the fixture, because availabilityFor() reads it out of the
     live `state` — the same place the Adjust Capacity dialog writes it. */
  fx.plans = [{ id: 'pl1', teamId: 't1', piId: null, sprintNumber: 6,
                availability: 60, reason: 'leave' }];
  withState(fx, () => {
    const slot = w.targetSprintSlot('t1');
    eq(slot.piId, null);
    eq(slot.sprintNumber, 6, 'the slot the dialog would have aimed at');
    eq(w.availabilityFor('t1', slot.piId, slot.sprintNumber).source, 'sprint',
      'it is in force before the reload');
    const saved = {
      teams: w.svGet().teams, arts: [], pis: [], objectives: [],
      sprints: w.svGet().sprints, plans: w.svGet().plans, settings: {},
    };
    const back = w.sanitizeIds(w.coerceShape(JSON.parse(JSON.stringify(saved))));
    eq(back.plans.length, 1, 'and still in force after it');
    eq(w.sanitizeIds.dropped, 0, 'with nothing reported as an orphaned sprint');
    eq(w.sanitizeIds.droppedPlans, 0);
  });
});

group('the sprint goal — the app’s one tri-state field');
/* `goalMet` is true, false, or the key ABSENT because nobody recorded one. Absent
   is deliberately NOT the blank-means-zero rule the rest of the sprint form
   follows: a blank points box really is zero points, but an unanswered goal is
   not a missed goal, and reading it as one would invent a failure for every
   sprint recorded before the field existed — which is all of them. */
const goalSprints = (goals) => goals.map((g, i) => {
  const s = { id: 's' + i, teamId: 't1', piId: 'p1', sprintNumber: i + 1,
    committed: 20, committedCompleted: 18, totalCompleted: 18,
    added: 0, removed: 0, carriedIn: 0, carriedOut: 2, addedThenRemoved: 0 };
  if (typeof g === 'boolean') s.goalMet = g;
  return s;
});
t('the rate counts only the sprints that answered, and says how many did not', () => {
  const g = w.goalRecord(goalSprints([true, false, true, null, null]));
  eq(g.met, 2);
  eq(g.recorded, 3, 'the two with no goal are not counted as missed');
  eq(g.total, 5);
  eq(g.missing.length, 2, 'and they come back, so the caption can name them');
  approx(g.pct, 2 / 3 * 100);
});
t('nothing recorded is null, not 0% — no denominator, no figure', () => {
  const g = w.goalRecord(goalSprints([null, null]));
  eq(g.pct, null);
  eq(g.recorded, 0);
  eq(g.met, 0);
});
t('an empty window does not throw', () => {
  eq(w.goalRecord([]).pct, null);
  eq(w.goalRecord(undefined).total, 0);
});
t('goalWord names all three states, so a prompt can print any of them', () => {
  const goalWord = w.__svTestHooks.goalWord;
  eq(goalWord(true), 'Met');
  eq(goalWord(false), 'Not met');
  eq(goalWord(undefined), 'Not recorded');
  eq(goalWord(null), 'Not recorded');
});
t('hasGoal is by TYPE, so a missed goal counts as recorded and a null does not', () => {
  const hasGoal = w.__svTestHooks.hasGoal;
  eq(hasGoal({ goalMet: false }), true, 'false is an answer, not an absence');
  eq(hasGoal({ goalMet: true }), true);
  eq(hasGoal({}), false);
  eq(hasGoal({ goalMet: null }), false);
});

group('the goal boundary — absent must survive as absent');
/* The whole point of the 'tribool' kind. 'bool' coerces with !!v, which would
   turn a null into false and silently record a missed goal; and a key written as
   undefined is the one value Firestore refuses outright, which stopped sync for a
   whole document once already. */
function goalPayload(goalMet) {
  const sprint = { id: 's1', teamId: 't1', piId: 'p1', sprintNumber: 1 };
  if (arguments.length) sprint.goalMet = goalMet;
  return w.sanitizeIds(w.coerceShape({
    teams: [{ id: 't1', name: 'A' }], arts: [], pis: [{ id: 'p1', name: 'PI' }],
    sprints: [sprint], settings: {},
  })).sprints[0];
}
t('true and false both survive, because both are real answers', () => {
  eq(goalPayload(true).goalMet, true);
  eq(goalPayload(false).goalMet, false);
});
t('a null is DROPPED, never coerced to "goal missed"', () => {
  ok(!('goalMet' in goalPayload(null)),
    '!!null would be false, which is a failure nobody recorded');
});
t('so is a string, a number and anything else that is not a boolean', () => {
  ok(!('goalMet' in goalPayload('yes')), '"yes" is truthy, and would read as met');
  ok(!('goalMet' in goalPayload(0)));
  ok(!('goalMet' in goalPayload({})));
});
t('an absent key stays absent, and is never created holding undefined', () => {
  const out = goalPayload();
  ok(!('goalMet' in out), 'by KEY, not by value — undefined would pass an === check either way');
});

group('the overwrite prompt — what it says is about to happen');
/* It fires when a FINISHED sprint is about to be rewritten, and its whole job is
   naming the change so an accidental save can be backed out of. `piById(null)` is
   null, so a sprint being moved OUT of a PI — which the form's own "No PI" option
   does — was described as moving "to another PI". */
function overwriteMessage(existing, record) {
  const realConfirm = w.confirm;
  let seen = '';
  w.confirm = (msg) => { seen = msg; return false; };
  try { w.confirmOverwrite(existing, record); } finally { w.confirm = realConfirm; }
  return seen;
}
const finished = { id: 's1', teamId: 't1', piId: 'p1', sprintNumber: 3, status: 'complete',
  committed: 30, committedCompleted: 28, totalCompleted: 31 };

t('moving a sprint OUT of a PI says so, rather than naming a PI it is not going to', () => {
  withState({ teams: [{ id: 't1', name: 'A' }], arts: [], plans: [], objectives: [],
              pis: [{ id: 'p1', name: 'PI 1' }], sprints: [finished] }, () => {
    const msg = overwriteMessage(finished, Object.assign({}, finished, { piId: null }));
    ok(msg.includes('Moving it to no PI'), 'got: ' + msg);
  });
});
t('moving it to a real PI still names that PI', () => {
  withState({ teams: [{ id: 't1', name: 'A' }], arts: [], plans: [], objectives: [],
              pis: [{ id: 'p1', name: 'PI 1' }, { id: 'p2', name: 'PI 2' }], sprints: [finished] }, () => {
    const msg = overwriteMessage(finished, Object.assign({}, finished, { piId: 'p2' }));
    ok(msg.includes('Moving it to PI 2'), 'got: ' + msg);
  });
});
t('and the same slot spelled two ways is not a move at all', () => {
  /* Through piKey, so a form handing back '' for a sprint stored as null does not
     read as a move and put a prompt in front of an ordinary edit. */
  withState({ teams: [{ id: 't1', name: 'A' }], arts: [], plans: [], objectives: [],
              pis: [], sprints: [] }, () => {
    const out = Object.assign({}, finished, { piId: null });
    const msg = overwriteMessage(out, Object.assign({}, out, { piId: '' }));
    eq(msg.includes('Moving it'), false, 'got: ' + msg);
  });
});

group('adoptState — the SCHEMA stamp on a copy from outside');
/* Every path that replaces `state` writes the CURRENT schema number, and it has
   to: a browser that upgrades, opens a copy saved by the old build and saves it
   back would otherwise write the OLD number over data now holding new fields —
   and the next older build to read it sails past haltForNewerData() and strips
   them. Invisible while SCHEMA had never moved off 1. */
t('an older copy is stamped with this build’s schema, not left on its own', () => {
  const out = w.adoptState({ version: 1, teams: [], arts: [], pis: [], sprints: [],
    plans: [], objectives: [], settings: {} });
  eq(out.version, w.__svTestHooks.SCHEMA);
});
t('a copy with no version at all is stamped too', () => {
  eq(w.adoptState({ teams: [] }).version, w.__svTestHooks.SCHEMA);
});
t('the objectives list survives adoption rather than being blanked', () => {
  const objectives = [{ id: 'o1', teamId: 't1', piId: 'p1', plannedBv: 10 }];
  eq(w.adoptState({ objectives }).objectives, objectives);
});

group('targets — the eight numbers, and whose they are');
/* Until 2026-08-22 all eight lived as literals in the file. They are settings now,
   which means two things have to hold and neither is obvious: every judgement in
   the app has to read the SETTING rather than a copy of it, and a hand-edited or
   shared copy has to be unable to put nonsense in one. */
const TG = () => w.__svTestHooks;

/* The suite is read-only, so a target is set for the length of one test and put
   back in a finally, exactly as withState() does with the collections. */
function withTargets(targets, fn) {
  const st = w.svGet();
  const before = st.settings.targets;
  if (targets) st.settings.targets = targets; else delete st.settings.targets;
  try { return fn(); }
  finally {
    if (before) st.settings.targets = before; else delete st.settings.targets;
  }
}

t('with nothing set, the defaults are the SAFe-ish ones the app shipped with', () => {
  withTargets(null, () => {
    eq(TG().tgt(), { completionGreen: 85, completionRed: 75, churnGreen: 15, churnRed: 20,
                     predLow: 80, predHigh: 100, predUnderRed: 70, predOverRed: 120 });
  });
});
t('a partial setting falls back key by key', () => {
  withTargets({ completionGreen: 95 }, () => {
    eq(TG().tgt().completionGreen, 95);
    eq(TG().tgt().churnGreen, 15, 'the other seven still come from the defaults');
  });
});
t('rag() judges by the setting, not by 85 and 15', () => {
  withTargets({ completionGreen: 95, churnGreen: 5 }, () => {
    eq(w.rag(90, 'completion'), 'yellow', '90% is no longer on target for this ART');
    eq(w.rag(96, 'completion'), 'green');
    eq(w.rag(10, 'churn'), 'yellow', 'and 10% break-in is now a watch');
  });
});
t('the band follows too, both edges and both reds', () => {
  withTargets({ predLow: 90, predHigh: 110, predUnderRed: 80, predOverRed: 130 }, () => {
    eq(w.rag(85, 'predictability'), 'yellow');
    eq(w.rag(79, 'predictability'), 'red');
    eq(w.rag(100, 'predictability'), 'green');
    eq(w.rag(131, 'predictability'), 'red');
    ok(w.predictabilityStatus(85).indexOf('90–110') >= 0, w.predictabilityStatus(85));
  });
});
t('the ⓘ target line is written from the setting, not captured at load', () => {
  withTargets({ completionGreen: 92, completionRed: 60 }, () => {
    const line = TG().METRIC_HELP.commitCompletion.target();
    ok(line.indexOf('92%') >= 0 && line.indexOf('60%') >= 0, line);
  });
});
t('TARGET_FIELDS covers every default, so nothing is editable-but-unbounded', () => {
  eq(TG().TARGET_FIELDS.map(f => f.key).sort(),
     Object.keys(TG().TARGET_DEFAULTS).sort());
});
t('a target set that contradicts itself is refused, one rule at a time', () => {
  const bad = (over) => w.targetProblems(Object.assign({}, TG().TARGET_DEFAULTS, over)).length;
  eq(w.targetProblems(TG().TARGET_DEFAULTS).length, 0, 'the defaults are legal');
  ok(bad({ completionGreen: 70 }) > 0, 'green under its own red leaves no amber');
  ok(bad({ churnRed: 10 }) > 0, 'churn runs the other way — red is the higher number');
  ok(bad({ predHigh: 70 }) > 0, 'a ceiling under the floor');
  ok(bad({ predUnderRed: 85 }) > 0, 'red-below has to sit under the floor');
  ok(bad({ predOverRed: 95 }) > 0, 'red-above has to sit over the ceiling');

/* ── Auto had to be told about this page's OWN tokens (2026-08-23) ────────────
   theme.css resolves Auto's palette on its own, in CSS, with no help from the
   page. What it cannot resolve is a token the page invented — and this page
   invented ten: six series colours, three threshold bands and a shadow. There
   was no [data-theme="auto"] block here at all, the only page in the family
   without one, so on Auto all ten fell back to :root, which holds the LIGHT
   values. A midnight card with light series shades painted onto it, and
   `color-scheme: light` telling the browser to draw its own controls light on a
   dark page — the exact fault the note at the top of :root says that property
   exists to prevent.

   It needed three things at once to show up — Auto, a dark system, and nobody
   having touched the picker — which is precisely the state a first-time reader
   arrives in and never the state of a browser used to develop the app. Nothing
   threw and nothing logged; the colours were just quietly the wrong theme's. */
group('Auto reaches this page\u2019s own tokens, not just the pack\u2019s');
/* `--shadow` was the eleventh entry here until 2026-08-23, when the family
   dropped elevation shadows outright — see the note in the app's :root block. */
const LOCAL_TOKENS = ['--c-committed', '--c-completed', '--c-velocity',
                      '--c-added', '--c-removed', '--c-carry',
                      '--band-green', '--band-yellow', '--band-red'];
/* A regex built from a token NAME. This used to escape hyphens and nothing else,
   which is precisely backwards — `-` is literal outside a character class, while
   `.`, `$`, `\` and the rest are not. CodeQL called it (js/incomplete-sanitization,
   three times) and was right about the shape even though LOCAL_TOKENS is a literal
   array ten lines up: a half-escape that is safe only because of its input is a
   habit, and the next one will not be. This escapes the whole metacharacter set,
   backslash included. */
const reEsc = (str) => str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
t('every local token Auto needs is declared for Auto', () => {
  /* Read off the source as well as measured below, because the measurement can
     only ever see the ONE system setting this browser happens to be in. */
  const auto = (APP_SRC.match(/@media \(prefers-color-scheme: dark\)[^{]*\{\s*\[data-theme="auto"\]\s*\{([^}]*)\}/) || [])[1];
  ok(auto, 'there is no dark-mode [data-theme="auto"] block — that is the bug this pins');
  LOCAL_TOKENS.forEach(tok =>
    ok(new RegExp(reEsc(tok) + '\\s*:').test(auto),
       tok + ' must be given Auto\u2019s dark value, or it falls back to :root\u2019s LIGHT one'));
  ok(/color-scheme:\s*dark/.test(auto),
     'and color-scheme, or the browser draws its own controls light on a dark page');
});
t('Auto means MIDNIGHT when the system is dark, never Dark', () => {
  /* Pack rule 6: midnight is the base palette and what Auto means by "dark".
     Read as source, so it holds whichever mode this browser is in. */
  const auto = (APP_SRC.match(/@media \(prefers-color-scheme: dark\)[^{]*\{\s*\[data-theme="auto"\]\s*\{([^}]*)\}/) || [])[1] || '';
  const midnight = (APP_SRC.match(/\[data-theme="midnight"\]\s*\{([^}]*)\}/) || [])[1] || '';
  const dark = (APP_SRC.match(/\[data-theme="dark"\]\s*\{([^}]*)\}/) || [])[1] || '';
  const val = (block, tok) => (block.match(new RegExp(reEsc(tok) + '\\s*:\\s*([^;]+);')) || [])[1];
  LOCAL_TOKENS.forEach(tok => {
    eq(val(auto, tok).trim(), val(midnight, tok).trim(), tok + ' must take Midnight\u2019s value');
  });
  ok(val(dark, '--c-committed').trim() !== val(midnight, '--c-committed').trim(),
     'Dark and Midnight really do differ here, so the assertion above means something');
});
t('the light half is left to inherit, deliberately', () => {
  /* In light mode Auto already IS :root. A block saying so would be a copy of
     the values above it — one more place to keep in step for no behaviour. */
  const plain = (APP_SRC.match(/\n\[data-theme="auto"\]\s*\{([^}]*)\}/) || [])[1] || '';
  ok(/color-scheme:\s*light/.test(plain), 'the unqualified auto rule carries color-scheme only');
  LOCAL_TOKENS.forEach(tok =>
    ok(!new RegExp(reEsc(tok) + '\\s*:').test(plain),
       tok + ' must NOT be repeated in the light half — it inherits from :root'));
});
t('and it resolves live, in whichever mode this browser is in', () => {
  const el = w.document.documentElement;
  const was = el.getAttribute('data-theme');
  try {
    const read = (th) => { el.setAttribute('data-theme', th);
      const c = w.getComputedStyle(el);
      return { scheme: c.colorScheme.trim(), c: c.getPropertyValue('--c-committed').trim(),
               bg: c.getPropertyValue('--bg').trim() }; };
    const auto = read('auto');
    const want = read(w.matchMedia('(prefers-color-scheme: dark)').matches ? 'midnight' : 'light');
    eq(auto.bg, want.bg, 'the pack resolves the palette');
    eq(auto.c, want.c, 'and this page\u2019s own series colour follows it');
    eq(auto.scheme, want.scheme, 'and so does color-scheme');
  } finally {
    el.setAttribute('data-theme', was || 'auto');
  }
});

/* ── Chart text is on the ramp, like every other size on the page ─────────── */
group('the charts follow the reader\u2019s text size');
t('makeChart sets a font SIZE, derived from the pack\u2019s scale', () => {
  /* It set the font FAMILY from the page and left the size alone, so every chart
     here ran at Chart.js's built-in 12px — under the pack's own 12px floor by
     nothing, off the ramp entirely, and deaf to a reader who has set their
     browser's default text size to 20px. That reader is why rule 7 moved the
     scale to rem in the first place. Flow Metrics already had this helper. */
  ok(/function fsPx\(step\)/.test(APP_SRC), 'the helper must exist');
  ok(/Chart\.defaults\.font\.size = fsPx\('xs'\)/.test(APP_SRC),
     'and makeChart must apply it — xs is the chrome step, which is what ticks and legends are');
  ok(!/Chart\.defaults\.font\.size\s*=\s*\d/.test(APP_SRC),
     'a raw pixel number has come back');
});
t('fsPx resolves a rem step against the LIVE root size', () => {
  const px = w.fsPx('xs');
  const rootEl = w.document.documentElement;
  const root = parseFloat(w.getComputedStyle(rootEl).fontSize);
  /* Not w.cssVar — that is a `const`, so it never lands on the window. fsPx is a
     function DECLARATION, which is why the app's own helper is reachable here
     and its neighbour is not. */
  const step = parseFloat(w.getComputedStyle(rootEl).getPropertyValue('--fs-xs'));
  ok(px > 0, 'it returned a number');
  ok(Math.abs(px - step * root) < 0.01, 'xs (' + step + 'rem) at a ' + root + 'px root is ' + px + 'px');
  ok(px >= 12, 'and it clears the pack\u2019s hard 12px floor, which the old 12px sat exactly on');
});

group('on paper — the print pass borrows the Light theme rather than owning colours');
t('printing swaps to light and back, and a doubled signal cannot lose the theme', () => {
  const el = w.document.documentElement;
  const before = el.getAttribute('data-theme');
  try {
    el.setAttribute('data-theme', 'midnight');
    w.printForPaper(true);
    eq(el.getAttribute('data-theme'), 'light');
    w.printForPaper(true);        // beforeprint AND the media query, as browsers do
    eq(el.getAttribute('data-theme'), 'light');
    w.printForPaper(false);
    eq(el.getAttribute('data-theme'), 'midnight', 'the reader gets their own theme back');
    w.printForPaper(false);       // and the pair on the way out too
    eq(el.getAttribute('data-theme'), 'midnight');
  } finally { el.setAttribute('data-theme', before); }
});
t('someone already on a light theme is left alone — Sepia included', () => {
  /* Sepia is the one worth pinning: it is a deliberate choice of a paper-coloured
     screen, and swapping it to Light for the printer would be the app overruling
     the reader. The theme pack's own print block skips the same two by name. */
  const el = w.document.documentElement;
  const before = el.getAttribute('data-theme');
  try {
    for (const t of ['light', 'sepia']) {
      el.setAttribute('data-theme', t);
      w.printForPaper(true);
      eq(el.getAttribute('data-theme'), t, t + ' must survive the print swap');
      w.printForPaper(false);
      eq(el.getAttribute('data-theme'), t);
    }
  } finally { el.setAttribute('data-theme', before); }
});
t('the print rules name no colour of their own beyond the white of the paper', () => {
  /* The whole point of the theme swap: a print palette in here would be a second
     copy of the shared pack to keep in step. #fff and #000 are paper and ink; #999
     is a hairline rule. Anything else is a colour that has escaped tokens.json. */
  const css = w.document.querySelector('style').textContent;
  const i = css.indexOf('@media print {');
  ok(i > 0, 'there is a print block at all');
  let depth = 0, j = i;
  for (; j < css.length; j++) {
    if (css[j] === '{') depth++;
    else if (css[j] === '}') { depth--; if (!depth) break; }
  }
  const block = css.slice(i, j);
  const colours = (block.match(/#[0-9a-fA-F]{3,8}\b/g) || [])
    .map(c => c.toLowerCase()).filter(c => ['#fff', '#000', '#999'].indexOf(c) < 0);
  eq(colours, [], 'stray colours in the print rules: ' + colours.join(', '));
});

group('installing it — the manifest, its icons and the directive that admits them');
/* The app was offline-capable for months before it was installable (2026-08-22),
   which is the wrong way round: an INSTALLED copy is the one most likely to be
   opened with no network at all. Every assertion here is about the four things
   that have to agree — the manifest, the files it names, the links in the head,
   and the CSP directive without which the browser never fetches any of it. */
t('the head links a manifest, an apple-touch-icon and a theme colour', () => {
  ok(/<link rel="manifest" href="manifest\.webmanifest">/.test(APP_SRC),
    'the page links a manifest, or nothing offers to install it');
  ok(/<link rel="apple-touch-icon" href="apple-touch-icon\.png">/.test(APP_SRC),
    'and an apple-touch-icon, which Safari prefers over the manifest’s own');
  ok(/<meta name="theme-color" content="#0a0e1a">/.test(APP_SRC),
    'with a theme-color for the installed window’s title bar, holding the default theme’s '
    + 'background as a literal because it has to be right before any script runs');
});
t('the CSP spells out manifest-src, or "Install app" silently stops appearing', () => {
  const csp = APP_SRC.match(/http-equiv="Content-Security-Policy" content="([^"]+)"/)[1];
  ok(/manifest-src 'self'/.test(csp),
    "under default-src 'none' a manifest is covered by no other directive, so the fetch is "
    + 'refused and nothing says why: ' + csp);
  ok(!/manifest-src[^;]*https?:/.test(csp), 'and it admits no off-origin host either');
});
/* ── The default theme ───────────────────────────────────────────────────────
   It moved from midnight to auto on 2026-08-22, so a reader who has never touched
   the picker follows their own system. That default lives in THREE places which have
   to agree, and none of them can see the other two:
     · <html data-theme="…">   what a browser with script disabled paints
     · the boot script         what a reader with nothing (or something retired) saved gets
     · the picker's `selected` what the header ROW reads while both of those happen
   Any one left on midnight is a silent disagreement — and silent in the direction that
   hides it, because on a dark-mode machine every combination looks identical. */
t('the default theme is auto, in the markup, the boot script and the picker', () => {
  ok(/<html[^>]*\sdata-theme="auto"/.test(APP_SRC),
    "<html> must carry data-theme=\"auto\", or a script-less load falls back to :root's midnight");
  const boot = stripComments(APP_SRC).match(/ok\.indexOf\(t\) === -1 \? '([a-z]+)'/);
  ok(boot, 'the boot script no longer normalises an unknown or missing saved theme id');
  eq(boot[1], 'auto', 'nothing saved, or a retired id, must land on the default');
  const opt = w.document.querySelector('#themeSel option[value="auto"]');
  ok(opt && opt.defaultSelected,
    'auto must carry `selected` in the markup, or the row names another theme until JS runs');
  eq([...w.document.querySelectorAll('#themeSel option')].filter((o) => o.defaultSelected).length,
    1, 'exactly one option may carry `selected`');
});
t('and themeId() agrees with it, so a retired saved id does not reopen midnight', () => {
  const fn = APP_SRC.match(/function themeId\(\)[\s\S]*?\n}/)[0];
  ok(/: 'auto'/.test(fn),
    'themeId() still falls back to midnight — the picker would offer Auto as the default and '
    + 'the page would open on something else');
});
t('the theme picker repaints that colour from the pack, never from a literal', () => {
  /* The literal in the head is only ever right for Midnight. applyTheme() is the
     one place the theme is applied, so the repaint belongs there — and it reads
     --bg, so this app never names a colour the pack does not own. */
  ok(/function paintThemeColor\(\)/.test(APP_SRC) && /cssVar\('--bg'\)/.test(APP_SRC),
    'paintThemeColor() must read the pack’s --bg');
  const applyTheme = APP_SRC.match(/function applyTheme\(\)[\s\S]*?\n}/)[0];
  ok(/paintThemeColor\(\)/.test(applyTheme),
    'and applyTheme() must call it, or a Light window keeps a midnight title bar');
});
t('the manifest itself is a real one, scoped to this app and no wider', async () => {
  const res = await bustFetch('manifest.webmanifest');
  ok(res.ok, 'manifest.webmanifest is missing');
  const MAN = await res.json();
  eq(MAN.scope, './', 'the scope is this app’s own directory');
  eq(MAN.start_url, './', 'and so is the start url');
  /* The named case, and the reason scope is relative: every one of these apps is
     served from ONE origin, so a scope of "/" would capture the siblings into this
     app's window. */
  ok(MAN.scope !== '/' && MAN.id.indexOf('sprint-velocity') >= 0,
    'never a scope of "/" — the family shares an origin, and that would swallow the siblings');
  eq(MAN.display, 'standalone', 'it installs as an app window rather than a browser tab');
  eq(MAN.icons.map(i => i.purpose).sort(), ['any', 'any', 'maskable'],
    'two unmasked icons and one maskable — a launcher crops the maskable to its own outline');
});
t('every file the manifest names exists, and is cached for offline', async () => {
  const MAN = await (await bustFetch('manifest.webmanifest')).json();
  const m = SW_SRC.match(/const SHELL = \[([\s\S]*?)\]/);
  const shell = [...m[1].matchAll(/'([^']+)'/g)].map((x) => x[1]);
  /* A 404 in this list is the failure that shows up as a blank icon on somebody’s
     home screen and nowhere else. */
  for (const icon of MAN.icons) {
    const res = await fetch(icon.src, { method: 'HEAD' });
    ok(res.ok, 'the manifest names ' + icon.src + ' and the file is there');
    ok(shell.includes(icon.src), 'and it is cached for offline — ' + icon.src);
  }
  ok(shell.includes('manifest.webmanifest'),
    'the manifest itself is cached too: a launcher re-reads it to draw the window');
  const apple = await bustFetch('apple-touch-icon.png', { method: 'HEAD' });
  ok(apple.ok, 'and apple-touch-icon.png exists, which only the head links');
});
t('the icon script still writes every file the manifest and the head name', async () => {
  /* The four PNGs are generated, not hand-drawn, so the names live in two places
     that must agree. Renaming one in make_favicon.py and nowhere else is a 404
     nobody sees until an install. */
  const res = await bustFetch('make_favicon.py');
  ok(res.ok, 'make_favicon.py is missing — the icons would have no source');
  const py = await res.text();
  for (const name of ['icon-192.png', 'icon-512.png', 'icon-512-maskable.png',
                      'apple-touch-icon.png'])
    ok(py.indexOf(name) >= 0, 'make_favicon.py no longer writes ' + name);
});

/* ── Runner ───────────────────────────────────────────────────────────────── */

/* The localhost gate. Booting the app is itself the side effect worth guarding:
   on the published origin the iframe would be a real, signed-in copy, and
   onAuthStateChanged would start a Firestore session — or raise the "another
   device cleared its data" dialog — inside a frame nobody can see. So the check
   comes before the iframe exists, not inside its load handler.

   file:// has no hostname, so it fails this check on its own and lands on the
   file:// advice below. '' is deliberately NOT in this list — it used to be, and
   sent file:// down the iframe branch, where the frame silently never loads and
   the suite blamed the app (see CLAUDE.md). */
const LOCAL_HOSTS = ['localhost', '127.0.0.1', '[::1]'];

if (LOCAL_HOSTS.includes(location.hostname)) {
  const frame = document.createElement('iframe');
  frame.id = 'app';
  frame.title = 'app under test';
  /* index.html checks for this and leaves the sync module uninitialised. */
  frame.setAttribute('data-sv-tests', '');
  frame.setAttribute('aria-hidden', 'true');
  frame.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none';
  frame.addEventListener('load', () => setTimeout(run, 150), { once: true }); // let boot finish
  frame.src = 'index.html' + BUST;    /* set before append: one load event, the real one */
  document.body.appendChild(frame);
} else {
  const s = document.getElementById('summary');
  s.className = 'bad';
  /* Two reasons to be here, needing different sentences: a published copy
     (where booting the app would touch real, signed-in data) and a file://
     copy off disk (where it simply cannot work — browsers block file://
     iframes). Both end at the same instruction. */
  const onDisk = location.protocol === 'file:';
  s.textContent = onDisk
    ? 'Not run from a file — this page needs a local server.'
    : 'Not run here — this page boots a live copy of the app.';
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = 3;
  td.style.cssText = 'font-size:13px;line-height:1.6';
  td.innerHTML = (onDisk
    ? 'The suite loads the app in a hidden frame to test it, and a browser blocks that '
      + 'frame when the page is opened straight off disk — so the tests would have nothing '
      + 'to run against. Serve the folder instead:'
    : 'The suite loads the app in a hidden frame to test it. On <strong></strong> '
      + 'that frame would be your real, signed-in copy, quietly starting a sync session where '
      + 'you can\'t see it. It runs on <code>localhost</code> only, against a copy served from '
      + 'the repo folder:') +
    '<br><br><code>cd ~/claude-sprint-velocity &amp;&amp; ' +
    'python3 -m http.server 8012</code><br>then open ' +
    '<code>http://localhost:8012/tests.html</code>.<br><br>' +
    'Nothing has been changed by opening this page — <a href="index.html">back to the app</a>.';
  if (!onDisk) td.querySelector('strong').textContent = location.hostname;
  tr.appendChild(td);
  document.getElementById('out').appendChild(tr);
  /* Only where the suite itself can't run. On localhost this row would land
     above the live results — and CI's scraper counts every tr.fail on the page,
     so a red PREVIOUS run rendered here could fail a suite that just passed. */
  showLatestRun();
}


/* ── The scorecard, where the suite itself can't run ─────────────────────────
   Refusing to run and then saying nothing about whether the tests pass is half
   an answer: the question someone opens this page to ask is "is it green?".
   The same suite runs headless in CI on every push, so ask GitHub how that went
   and show it here. Nothing is booted and nothing is stored — it is one public,
   unauthenticated read of a workflow's run list.
─────────────────────────────────────────────────────────────────────────── */
function showLatestRun() {
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = 3;
  td.style.cssText = 'font-size:14px;line-height:1.6;padding:12px 16px';
  td.textContent = 'Checking the latest CI run…';
  tr.appendChild(td);
  document.getElementById('out').appendChild(tr);

  fetch('https://api.github.com/repos/eagleadams86/sprint-velocity/actions/workflows/tests.yml/runs?branch=main&per_page=1')
    .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
    .then((d) => {
      const run = d && d.workflow_runs && d.workflow_runs[0];
      if (!run) { td.textContent = 'No CI runs found for this repository yet.'; return; }
      const done = run.status === 'completed';
      const okRun = run.conclusion === 'success';
      tr.className = !done ? '' : (okRun ? 'pass' : 'fail');
      const when = run.updated_at ? new Date(run.updated_at).toLocaleString() : '';
      const sha = String(run.head_sha || '').slice(0, 7);
      /* Only ever build an <a> when the API really did hand back a GitHub https
         URL — the same guard the app uses for any URL out of an API. */
      const url = String(run.html_url || '');
      td.textContent = (!done ? '⏳ The latest run is still going'
        : okRun ? '✓ The full suite passed in CI' : '✕ The suite FAILED in CI')
        + (when ? ' — ' + when : '') + (sha ? ' · commit ' + sha : '') + '. ';
      if (/^https:\/\/github\.com\//.test(url)) {
        const a = document.createElement('a');
        a.href = url; a.rel = 'noopener noreferrer';
        a.textContent = 'Open the run for the full scorecard';
        td.appendChild(a);
      }
    })
    .catch(() => { td.textContent = 'Could not reach GitHub to check the latest CI run.'; });
}

group('package.json — the manifest Dependabot scans');

/* This repo vendors Chart.js and, until 2026-08-22, was the ONE of the four
   that carried it with no manifest beside it. The other three — lottery,
   team-dashboard and financial-plan — have had a package.json since the
   pattern was set, so a Chart.js advisory reached Dependabot for those three
   and reached nothing here. Same bytes, same version, silently unwatched, in
   one of the two apps that hold figures copied from work.

   The manifest exists only so Dependabot has something to read. Nothing is
   ever installed from it — CI passes `--omit=dev` precisely so npm does not
   helpfully download the library this app already vendors — and the bytes that
   ship are `chart.min.js` beside index.html.

   That arrangement has one specific way of going wrong: Dependabot cannot
   re-vendor a file. A version-bump PR would raise the manifest to 4.5.0 while
   the app went on serving 4.4.1, and the repo would then state a version it
   does not run. This is what stops that being quiet — a manifest-only bump
   fails here, which turns the PR into the correct instruction ("a newer
   Chart.js exists; now update the FILE too, in all four repos that carry it")
   instead of a false record. It is the theme pack's rule in another repo: a
   generated artefact has to match its source. */
t('the manifest exists, and names the version the vendored file actually is', async () => {
  const [pkgRes, libRes] = await Promise.all([bustFetch('package.json'), bustFetch('chart.min.js')]);
  ok(pkgRes.ok, 'a manifest exists for Dependabot to scan');
  ok(libRes.ok, 'and the library it names is vendored beside it');
  const PKG_SRC = await pkgRes.text(), LIB_SRC = await libRes.text();
  const pinned = (PKG_SRC.match(/"chart\.js"\s*:\s*"([^"]+)"/) || [])[1];
  ok(pinned, 'the manifest declares chart.js');
  ok(/^\d+\.\d+\.\d+$/.test(pinned || ''),
    'it is pinned exactly, so it can be checked against a file — got ' + pinned);
  ok(LIB_SRC.includes('"' + pinned + '"'),
    'the vendored bundle is that same version — manifest says ' + pinned
    + ', so re-vendor chart.min.js, and the sibling repos with it');
});
t('the manifest can never be installed from, or reach npm', async () => {
  const pkg = JSON.parse(await (await bustFetch('package.json')).text());
  eq(pkg.private, true, 'the manifest is private, so it can never reach npm');
  ok(!pkg.scripts, 'it declares no scripts — this repo has no build step');
  ok(!pkg.dependencies, "the entry is a devDependency, which CI's --omit=dev skips");
  eq(Object.keys(pkg.devDependencies || {}).length, 1,
    'and it names one thing only: the vendored library');
});
/* The manifest is only watched if CI never installs from it. A workflow that
   dropped --omit=dev would quietly start downloading Chart.js on every run —
   the exact thing the vendoring exists to avoid — and nothing else here would
   notice. */
t('CI installs with --omit=dev, so npm never fetches what this repo vendors', async () => {
  const res = await bustFetch('.github/workflows/tests.yml');
  ok(res.ok, 'the tests workflow is readable');
  const yml = await res.text();
  const install = (yml.match(/^\s*npm install .*$/m) || [''])[0];
  ok(/--omit=dev/.test(install),
    'the npm install passes --omit=dev, or CI downloads the vendored library — got: '
    + install.trim());
});

/* ── Select-on-focus versus a number field’s spin arrows ──────────────────────
   Clicking a box selects what is in it, which takes cancelling the mouseup —
   that is what would otherwise place the caret and collapse the selection.
   Chrome’s number spinner ALSO ends its press on the mouseup’s default action:
   it repeats while an arrow is held down and stops when the release is allowed
   through. Cancelling it there left ONE click on a down arrow running the value
   all the way to its minimum (found in Flow Metrics, 2026-08-21).

   Press, focus and release are all dispatched by hand, for two reasons: a
   synthetic press never reaches the browser’s own spin button, and focus()
   inside a frame nobody is looking at sets activeElement without firing focusin
   until the frame is focused. So what a real click looks like is not observable
   from here — but the DECISION the guard makes is, and the decision is the part
   that was wrong. The value moving between the press and the release means a
   spin, and a spin has no caret to protect. Same block in every app in the
   family, so it is pinned in every suite. */
function spinProbe(appWin, setUp) {
  const box = appWin.document.createElement('input');
  box.type = 'number'; box.value = '14'; box.min = '1';
  appWin.document.body.appendChild(box);
  try {
    setUp(box);
    const up = new appWin.MouseEvent('mouseup', { bubbles: true, cancelable: true });
    box.dispatchEvent(up);
    return up.defaultPrevented;
  } finally {
    /* Releases the pointer flag as a real release would; without it the next
       probe would inherit a press that never ended. */
    box.dispatchEvent(new appWin.PointerEvent('pointerup', { bubbles: true }));
    box.remove();
  }
}
function spinFocusIn(appWin, el) { el.dispatchEvent(new appWin.FocusEvent('focusin', { bubbles: true })); }
function spinPress(appWin, el)   { el.dispatchEvent(new appWin.PointerEvent('pointerdown', { bubbles: true })); }

group('Select-on-focus versus a number field’s spin arrows');
t('a plain click keeps the select-all — the caret placement is cancelled', () => {
  ok(spinProbe(w, (box) => { spinPress(w, box); spinFocusIn(w, box); }));
});
t('a spin press is let through, so the browser stops repeating on the release', () => {
  eq(spinProbe(w, (box) => { spinPress(w, box); spinFocusIn(w, box); box.value = '13'; }), false);
});
t('a click on the label still selects, exactly as before', () => {
  ok(spinProbe(w, (box) => {
    /* No press on the box of its own to compare against, so the value as it
       stands at focus stands in and that path is left as it was. */
    const lab = w.document.createElement('label');
    w.document.body.appendChild(lab);
    spinPress(w, lab); spinFocusIn(w, box); lab.remove();
  }));
});
t('a focus with no press behind it guards nothing — a Tab has no caret to place', () => {
  eq(spinProbe(w, (box) => { spinFocusIn(w, box); }), false);
});

async function run() {
  w = document.getElementById('app').contentWindow;
  /* A frame that never got the app is a SETUP problem — the folder isn't being
     served, so index.html came back 404 — and without this every test throws
     "Cannot read properties of undefined" in turn, which reads like the app is
     catastrophically broken. Say the one thing that fixes it instead. */
  if (!w || !w.__svTestHooks) {
    const s = document.getElementById('summary');
    s.className = 'bad';
    s.textContent = 'The hidden frame never loaded index.html — is this folder being served?';
    document.getElementById('out').innerHTML =
      '<tr><td class="msg" style="white-space:normal;font-family:inherit;font-size:13px">' +
      'Run <code>cd ~/claude-sprint-velocity &amp;&amp; python3 -m http.server 8012</code> and open ' +
      '<code>http://localhost:8012/tests.html</code>.</td></tr>';
    return;
  }
  const out = document.getElementById('out');
  let pass = 0, fail = 0;
  for (const item of TESTS) {
    if (item.group) {
      const tr = document.createElement('tr');
      tr.className = 'group';
      tr.innerHTML = '<td colspan="3"></td>';
      tr.firstChild.textContent = item.group;
      out.appendChild(tr);
      continue;
    }
    const tr = document.createElement('tr');
    const st = document.createElement('td'); st.className = 'st';
    const name = document.createElement('td'); name.textContent = item.name;
    const msg = document.createElement('td'); msg.className = 'msg';
    try {
      /* Awaited, so a test may be async — the share round-trip group is, because
         encodeShare/decodeShare are. A sync test resolves immediately, and
         running one at a time keeps the rows in declaration order either way. */
      await item.fn();
      tr.className = 'pass'; st.textContent = '✓'; pass++;
    } catch (e) {
      tr.className = 'fail'; st.textContent = '✕'; msg.textContent = e.message; fail++;
    }
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
  }
  /* The floor — see EXPECTED at the top of this file. Written as a row of its
     own so it reads like any other failure, and counted into `fail` so the
     summary goes red and CI's `All N tests pass` check does not match. */
  if (pass + fail < EXPECTED) {
    const tr = document.createElement('tr');
    tr.className = 'fail';
    const st = document.createElement('td'); st.className = 'st'; st.textContent = '\u2715';
    const name = document.createElement('td');
    name.textContent = 'the suite ran only ' + (pass + fail) + ' of at least '
      + EXPECTED + ' tests';
    const msg = document.createElement('td'); msg.className = 'msg';
    msg.textContent = 'tests have gone missing rather than failed, so a green result here '
      + 'would cover a fraction of the suite. If they were retired on purpose, lower '
      + 'EXPECTED to match.';
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
    fail++;
  }
  const s = document.getElementById('summary');
  s.textContent = fail === 0 ? `All ${pass} tests pass` : `${fail} of ${pass + fail} tests FAILED`;
  s.className = fail === 0 ? 'ok' : 'bad';
  document.title = (fail === 0 ? '✓ ' : '✕ ') + document.title;
}
